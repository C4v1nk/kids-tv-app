/* ---------------------- Screensaver video ---------------------- */
// Tries to load and play the screensaver directly, and only shows the
// friendly fallback if the <video> element itself reports a real failure
// (file missing, bad URL, unsupported format). This intentionally does NOT
// pre-check the file with a fetch() first — a fetch() to a different site
// (SCREENSAVER_URL hosted on its own separate site, its own address) needs
// a cross-origin permission a plain video file doesn't send by default,
// which made that pre-check fail even when the video itself was completely
// fine. A <video> element loading a file doesn't have that restriction, so
// checking this way works identically whether the file is on this same
// site or a different one.
// Every place the screensaver loop could come from, cheapest first. This
// matters more than it looks: the screensaver is the one video that plays
// on all ten TVs continuously, all morning. Served from our own website
// that is, by a wide margin, the single largest thing the site does — a
// two-hour loop re-fetched by ten TVs runs into many gigabytes a Sunday,
// which is exactly the kind of number that exhausts a free hosting plan
// and takes the whole dashboard offline with it. Fetched straight from
// Google Drive instead, it costs the website nothing at all.
function screensaverSources(){
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  const id = (CONFIG.SCREENSAVER_FILE_ID || '').trim();
  if (key && id) {
    const apiUrl = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) +
                   '?alt=media&key=' + encodeURIComponent(key);
    list.push({ url: apiUrl, crossOrigin: 'anonymous' });
    list.push({ url: apiUrl, crossOrigin: null });
  }
  if (CONFIG.SCREENSAVER_URL) list.push({ url: CONFIG.SCREENSAVER_URL, crossOrigin: null });
  if (id && !key) list.push({ url: '/watch-video?id=' + encodeURIComponent(id), crossOrigin: null });
  return list;
}

(function initScreensaver(){
  const sources = screensaverSources();
  let i = 0;

  function tryNext(){
    if (i >= sources.length) { showScreensaverFallback(); return; }
    const s = sources[i];
    i++;
    if (s.crossOrigin) screensaverVideo.setAttribute('crossorigin', s.crossOrigin);
    else screensaverVideo.removeAttribute('crossorigin');
    screensaverVideo.src = s.url;
    screensaverVideo.load();
    tryPlay();
  }

  function tryPlay(){
    screensaverVideo.play().catch(() => {
      // Autoplay-with-sound was blocked by the browser. Fall back to
      // muted autoplay so at least the picture loops; a single tap
      // anywhere unmutes it (kiosk browsers usually allow this).
      screensaverVideo.muted = true;
      screensaverVideo.play().catch(()=>{});
    });
  }

  screensaverVideo.addEventListener('error', tryNext);
  screensaverVideo.muted = false;
  tryNext();
})();

function showScreensaverFallback(){
  screensaverVideo.style.display = 'none';
  screensaverFallback.style.display = 'flex';
}

// Some browsers — and especially some kiosk-browser apps' built-in web
// views — won't actually start ANY video playback, even muted, until a
// real button press has happened somewhere on the page; the automatic
// play() attempt at page load can fail silently with nothing to react to,
// leaving the screensaver stuck on a blank black frame until something
// else happens to call play() again (which is why going into the menu and
// back out "fixed" it — that later play() call finally had a real press
// behind it). The very first press/tap anywhere kicks the video into
// gear for real, and unmutes it too, with no on-screen instruction needed
// — it just starts working normally from then on.
function primeScreensaverOnFirstPress(){
  // Always (re)try play() — harmless if it's already playing, and this is
  // what actually gets a stuck/never-started video going for the first time.
  screensaverVideo.play().catch(() => {});
  if (screensaverVideo.muted) {
    // Unmute at silence, not full volume — the same key press is about to
    // open the menu (which ducks audio anyway), so this avoids a jarring
    // half-second blast of full-volume sound right as the screen changes.
    screensaverVideo.volume = 0;
    screensaverVideo.muted = false;
    screensaverVideo.play().catch(() => {});
  }
  document.removeEventListener('keydown', primeScreensaverOnFirstPress, true);
  document.removeEventListener('click', primeScreensaverOnFirstPress, true);
}
document.addEventListener('keydown', primeScreensaverOnFirstPress, true);
document.addEventListener('click', primeScreensaverOnFirstPress, true);

/* ---------------------- CSV loading ---------------------- */
function parseCSV(text){
  // Minimal RFC4180-ish CSV parser: handles quoted fields with commas
  // and escaped quotes, which a plain text.split(',') cannot.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ''));
}

// The seventh column has held two different things over this app's life: on
// older sheets it's a "Last Synced" timestamp, and on current ones it's the
// file's real format ("video/mp4"). Rather than guess by which version of the
// sync script is installed — and rather than tell a teacher a Bible story is
// "not a video" because a date landed in that column — only accept a value
// that actually looks like a format, and ignore anything else.
function sanitizeMimeType(raw){
  const v = String(raw || '').trim().toLowerCase();
  if (!v) return '';
  return /^[a-z0-9.+-]+\/[a-z0-9.+-]+$/.test(v) ? v : '';
}

function extractDriveId(raw){
  if (!raw) return null;
  raw = raw.trim();
  // Already a bare file ID (no slashes or spaces)
  if (/^[a-zA-Z0-9_-]{15,}$/.test(raw)) return raw;
  // Full share link: .../d/FILEID/...
  let m = raw.match(/\/d\/([a-zA-Z0-9_-]{15,})/);
  if (m) return m[1];
  // ?id=FILEID style link
  m = raw.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
  if (m) return m[1];
  return null;
}

async function loadConfigFromSheet(){
  try {
    const res = await fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (!rows.length) throw new Error('Sheet came back empty');

    // Skip header row (first row). Columns: Label, Drive Link or File ID,
    // Color (optional), Icon (optional), Room (optional), Group (optional —
    // which week/subfolder a video came from; blank = shows on the main menu),
    // Type (optional — the file's real format, e.g. "video/mp4", written by
    // the sync script; blank on older sheets, which is fine: it's only used
    // to explain a failure more precisely if one happens).
    const parsedAll = rows.slice(1).map(r => ({
      label: (r[0] || '').trim(),
      fileId: extractDriveId(r[1] || ''),
      color: (r[2] || '').trim() || CONFIG.DEFAULT_BUTTON_COLOR,
      icon: (r[3] || '').trim() || '▶️',
      room: (r[4] || '').trim().toLowerCase(),
      group: (r[5] || '').trim(),
      type: sanitizeMimeType(r[6])
    })).filter(b => b.label && b.fileId);

    if (!parsedAll.length) throw new Error('No valid rows found (check Label + Drive link columns)');

    const parsed = parsedAll.filter(b => !ROOM || !b.room || b.room === 'both' || b.room === ROOM);

    if (!parsed.length) {
      // Distinguish "the sheet is broken" from "this room just has nothing
      // assigned yet" — very different fixes, so worth telling apart.
      throw new Error(ROOM
        ? 'The sheet has videos, but none tagged for room "' + ROOM + '" (or "Both") yet'
        : 'No valid rows found (check Label + Drive link columns)');
    }

    buttons = parsed;
    // If the folder/week the teacher currently has open got renamed or
    // removed in this sync, don't strand them on a dead sub-list — fall
    // back to the main menu next render.
    if (activeGroup && !buttons.some(b => b.group === activeGroup)) activeGroup = null;
    try { localStorage.setItem('ktv_last_good_config', JSON.stringify(buttons)); } catch(e) {}
    loadThumbnailsUpFront(buttons);
    renderButtons();
    updateMenuTitle();
    updateBackButtonLabel();
    setStatus(true);
  } catch (err) {
    console.warn('Sheet load failed, using last known good config:', err);
    setStatus(false);
    if (!buttons.length) {
      try {
        const cached = JSON.parse(localStorage.getItem('ktv_last_good_config') || 'null');
        if (cached && cached.length) {
          buttons = cached;
          if (activeGroup && !buttons.some(b => b.group === activeGroup)) activeGroup = null;
          loadThumbnailsUpFront(buttons);
          renderButtons();
          updateMenuTitle();
          updateBackButtonLabel();
        }
      } catch(e) {}
    }
    if (!buttons.length) renderEmptyState(err.message);
  }
}

function setStatus(isLive){
  statusLine.className = 'status' + (isLive ? '' : ' stale');
  statusLine.title = isLive ? 'Up to date' : 'Showing last saved list (couldn’t reach the sheet)';
}

function renderEmptyState(reason){
  // Shown on the TV itself with no mouse around to hover a tooltip, so the
  // real reason (not just "something's wrong") goes right on the screen.
  buttonGrid.innerHTML = '<div id="emptyState">No videos to show yet.<br>' +
    (reason ? escapeHtml(reason) : 'Check the SHEET_CSV_URL setting and the Google Sheet.') + '</div>';
}

/* ---------------------- Folders (weekly subfolders) ----------------------
   Mom's Elementary/Preschool Drive folders contain "Week 1", "Week 2" style
   subfolders. The sync script tags each video with which subfolder (if any)
   it came from as its "group". A video with no group (loose in the room's
   top folder) shows directly on the main menu, same as always. A video
   with a group doesn't show directly — instead, one folder button per
   distinct group appears (e.g. "Week 1"), and clicking it opens a
   sub-list of just that week's videos, with the same back button one
   level up to the main menu. */
// A row is a picture (not a video) when the sync script recorded its real
// format as "image/...". Older sheets (or a hand-added row with no Type
// filled in) have no type at all — those default to 'video', exactly the
// behavior this app always had, so nothing changes for anyone who hasn't
// re-synced yet.
function mediaKind(b){
  return (b.type && b.type.indexOf('image/') === 0) ? 'image' : 'video';
}

function computeVisibleItems(){
  if (activeGroup) {
    return buttons.filter(b => b.group === activeGroup).map(b => ({ kind: mediaKind(b), data: b }));
  }
  const videoEntries = buttons.filter(b => !b.group).map(b => ({ kind: mediaKind(b), data: b }));
  const seen = new Set();
  const folderNames = [];
  buttons.forEach(b => {
    if (b.group && !seen.has(b.group)) { seen.add(b.group); folderNames.push(b.group); }
  });
  const folderEntries = folderNames.map(name => ({ kind: 'folder', name: name }));
  return videoEntries.concat(folderEntries);
}

function renderButtons(){
  const items = computeVisibleItems();
  visibleItems = items;

  if (!items.length) {
    buttonGrid.innerHTML = '<div id="emptyState">' +
      (activeGroup ? ('Nothing in "' + escapeHtml(activeGroup) + '" right now.') : 'No videos to show yet.') +
      '</div>';
    focusedIndex = 0;
    applyFocusVisual();
    return;
  }

  buttonGrid.innerHTML = '';
  items.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.dataset.index = i;
    if (item.kind === 'folder') {
      btn.className = 'btn btn-folder';
      btn.style.setProperty('--btn-color', CONFIG.FOLDER_COLOR);
      btn.innerHTML = '<div class="icon">' + escapeHtml(CONFIG.FOLDER_ICON) + '</div><div class="label">' + escapeHtml(item.name) + '</div>';
    } else {
      const b = item.data;
      btn.className = 'btn btn-video';
      btn.style.setProperty('--btn-color', b.color);
      btn.innerHTML = '<div class="icon">' + escapeHtml(b.icon) + '</div><div class="label">' + escapeHtml(b.label) + '</div>';
      attachThumbnail(btn, b.fileId);
    }
    btn.addEventListener('click', () => activateItem(i));
    buttonGrid.appendChild(btn);
  });
  focusedIndex = 0;
  applyFocusVisual();
}

function activateItem(i){
  const item = visibleItems[i];
  if (!item) return;
  if (item.kind === 'folder') { enterGroup(item.name); }
  else if (item.kind === 'image') { showImage(item.data); }
  else { playVideo(item.data); }
}

function enterGroup(name){
  activeGroup = name;
  renderButtons();
  updateMenuTitle();
  updateBackButtonLabel();
}

function backToRootMenu(){
  activeGroup = null;
  renderButtons();
  updateMenuTitle();
  updateBackButtonLabel();
}

// The corner back button (and the remote's Escape/Backspace/Back) goes up
// one level at a time: out of a week folder to the main menu first, and
// only back to the screensaver from the main menu itself.
function handleMenuBack(){
  if (activeGroup) { backToRootMenu(); } else { showScreensaver(); }
}

function updateMenuTitle(){
  const titleEl = document.getElementById('menuTitle');
  titleEl.textContent = activeGroup || CONFIG.MENU_TITLE;
}

function updateBackButtonLabel(){
  const label = activeGroup ? 'Back to menu' : 'Back to screensaver';
  menuCloseBtn.setAttribute('aria-label', label);
  menuCloseBtn.title = label;
}

// The player's own back button returns to wherever the video was picked
// from — the main menu, or the specific week folder it was inside — never
// straight past the menu to the screensaver.
function updatePlayerBackButtonLabel(){
  const label = activeGroup ? ('Back to ' + activeGroup) : 'Back to menu';
  playerBackBtn.setAttribute('aria-label', label);
  playerBackBtn.title = label;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

/* ---------------------- Video thumbnails ---------------------- */
// Uses Google's public thumbnail image for each Drive file so a button
// shows the video's actual picture instead of a generic icon. If a
// particular file's thumbnail doesn't come through (not shared quite
// right, an unusual file type, Google not generating one for it, etc.)
// the button just keeps its plain icon+color look — nothing ever shows
// broken.
//
// Thumbnails are preloaded for every video as soon as the sheet loads
// (see loadThumbnailsUpFront below), not only when a button for them
// happens to get created. Before this, opening a folder built its buttons
// fresh with a plain icon first and only added the picture once a brand
// new Image() finished loading a moment later — so every single time a
// teacher opened a folder (even one they'd already opened before), every
// tile visibly flashed icon-then-photo. Now a shared cache remembers each
// file's thumbnail result across the whole session: once it's loaded once,
// any button for that same file — this visit or a later one — gets the
// picture immediately, with nothing to flash.
const thumbStatus = new Map();      // fileId -> 'loading' | 'loaded' | 'failed'
const thumbWaiters = new Map();     // fileId -> [callback, ...] still waiting on a first-time load

function thumbnailUrl(fileId){
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fileId) + '&sz=w800';
}

function preloadThumbnail(fileId){
  if (thumbStatus.has(fileId)) return; // already loaded, failed, or already loading — nothing to do
  thumbStatus.set(fileId, 'loading');
  const img = new Image();
  img.onload = () => {
    thumbStatus.set(fileId, 'loaded');
    const waiters = thumbWaiters.get(fileId) || [];
    thumbWaiters.delete(fileId);
    waiters.forEach(cb => cb('loaded'));
  };
  img.onerror = () => {
    thumbStatus.set(fileId, 'failed');
    const waiters = thumbWaiters.get(fileId) || [];
    thumbWaiters.delete(fileId);
    waiters.forEach(cb => cb('failed'));
  };
  img.src = thumbnailUrl(fileId);
}

// Kicks off loading every known video's thumbnail in the background the
// moment the sheet is parsed — long before a teacher navigates into any
// particular folder — so by the time they do, most (usually all) of that
// folder's thumbnails are already sitting ready in the cache above.
function loadThumbnailsUpFront(list){
  list.forEach(b => preloadThumbnail(b.fileId));
}

function attachThumbnail(btn, fileId){
  const status = thumbStatus.get(fileId);
  if (status === 'loaded') {
    btn.style.setProperty('--btn-thumb', 'url("' + thumbnailUrl(fileId) + '")');
    btn.classList.add('has-thumb');
    return;
  }
  if (status === 'failed') return; // stays icon, matches the old silent-failure behavior
  // Not resolved yet (first time this file's ever been seen, or still
  // mid-flight) — wait for it and apply the moment it resolves. Guarded by
  // `btn.isConnected` because renderButtons() rebuilds every button on each
  // navigation; without that check, a slow thumbnail resolving after the
  // teacher has already moved to a different screen could reach into a
  // button element that isn't even on screen anymore.
  if (!thumbWaiters.has(fileId)) thumbWaiters.set(fileId, []);
  thumbWaiters.get(fileId).push((result) => {
    if (!btn.isConnected) return;
    if (result === 'loaded') {
      btn.style.setProperty('--btn-thumb', 'url("' + thumbnailUrl(fileId) + '")');
      btn.classList.add('has-thumb');
    }
  });
  preloadThumbnail(fileId); // safety net — normally already kicked off by loadThumbnailsUpFront
}

/* ---------------------- Screensaver audio fade ---------------------- */
// Fades the screensaver's volume smoothly instead of an abrupt cut/jump,
// so it ducks out when a video is picked and eases back in on return.
let fadeTimer = null;
function fadeScreensaverVolume(target, duration, onDone){
  if (fadeTimer) clearInterval(fadeTimer);
  const steps = 20;
  const start = screensaverVideo.volume;
  const delta = (target - start) / steps;
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    screensaverVideo.volume = Math.max(0, Math.min(1, start + delta * i));
    if (i >= steps) {
      clearInterval(fadeTimer);
      fadeTimer = null;
      screensaverVideo.volume = target;
      if (onDone) onDone();
    }
  }, duration / steps);
}
function duckScreensaver(){
  if (screensaverVideo.paused || screensaverVideo.muted) { screensaverVideo.pause(); return; }
  fadeScreensaverVolume(0, 500, () => screensaverVideo.pause());
}
function unduckScreensaver(){
  screensaverVideo.volume = 0;
  screensaverVideo.play().catch(() => {});
  fadeScreensaverVolume(1, 600);
}

/* ---------------------- View transitions ---------------------- */
function showScreensaver(){
  currentView = 'screensaver';
  playerEl.classList.remove('is-paused', 'chrome-hidden');
  clearTimeout(chromeTimer);
  activeGroup = null; // always wake up back at the main menu, not wherever a teacher left off
  menuEl.classList.remove('open');
  playerEl.classList.remove('open');
  playerFrameWrap.innerHTML = ''; // stop any playing video
  clearTimeout(playerLoadTimeout);
  playAttemptToken++; // invalidate any in-flight video-load attempt we're leaving behind
  clearIdleTimer();
  unduckScreensaver();
}

function showMenu(){
  currentView = 'menu';
  playerEl.classList.remove('is-paused', 'chrome-hidden');
  clearTimeout(chromeTimer);
  playerEl.classList.remove('open');
  playerFrameWrap.innerHTML = '';
  clearTimeout(playerLoadTimeout);
  playAttemptToken++; // invalidate any in-flight video-load attempt we're leaving behind
  menuEl.classList.add('open');
  clearIdleTimer();
  renderButtons();
  updateMenuTitle();
  updateBackButtonLabel();
  duckScreensaver();
}

// Plays the video directly with our own <video> element instead of embedding
// Google Drive's own preview page. This used to be a Drive-hosted iframe with
// Drive's own on-screen play button — but that button turned out to be
// unreachable from a TV remote (Fully Kiosk Browser has no way to "click" into
// cross-origin iframe content with a D-pad), so teachers had no way to start
// a video at all. A plain <video> element is ours to control directly: we can
// call .play() ourselves the instant the button is pressed (which is exactly
// the kind of real button-press browsers require to allow autoplay-with-sound
// — no extra tap needed), and our own on-screen back button works the same
// way it does everywhere else in the app.
//
// Getting the actual video bytes reliably took two real fixes, in order:
//
// Fix 1 — finding Google's real download link at all. Google shows a "can't
// scan this file for viruses" warning page instead of the actual video for
// most lesson-video-sized files, and the real "download anyway" link on that
// page is different every time — reading it requires a request our own
// page's JavaScript is blocked from making across origins (confirmed
// directly: a plain fetch() to Google's Drive endpoints from here is
// rejected before it even gets a response). So a small helper program has to
// do that reading instead, from a server, modeled on gdown (a well-known,
// actively maintained tool built specifically to download Drive files this
// way).
//
// Fix 2 — actually playing what that helper finds. The first version of
// that helper found the real link correctly, then just redirected the TV
// straight to Google to fetch it directly — which turned out to still fail
// for every real video, confirmed directly in Chrome's own Network panel:
// every attempt showed "(failed) net::ERR_BLOCKED_BY_ORB." ORB (Opaque
// Response Blocking) is a real browser security feature that blocks a
// <video> tag from playing a file handed back from a different website
// unless that website explicitly allows it — which Google Drive's own
// servers don't. So the helper (netlify/edge-functions/stream-video.js) now
// does one more thing: instead of redirecting the TV to Google, it fetches
// the video itself and streams those bytes back as its own reply — which
// makes the request look, to the browser, exactly like any other file
// already sitting on this same site, with nothing "foreign" left for ORB to
// block. Verified end-to-end, including that a real decoded video frame
// actually loads this way with no blocked request anywhere in the chain.
// -------------------------------------------------------------------------
// WHERE A VIDEO'S BYTES ACTUALLY COME FROM
// -------------------------------------------------------------------------
// There are two ways to get a Drive video onto the TV, and the app tries the
// good one first and quietly falls back to the other if it can't:
//
//   1. "google-direct" — ask Google's official Drive API for the file, with
//      the API key from CONFIG. The video travels straight from Google to the
//      TV and never touches our website, which makes it FREE (our website
//      host charges for every byte it serves) and faster, and it skips the
//      fragile business of reading Google's "can't scan this for viruses"
//      warning page entirely — the API just hands over the file. Two flavors
//      are tried, one asking Google's permission-to-share headers explicitly
//      and one not, because which of those a browser is happy with varies.
//
//   2. "site-helper" — our own /watch-video helper, which downloads the file
//      server-side and passes the bytes along. Always works, needs no key,
//      but every byte counts against our website host's monthly allowance.
//
// If no API key is configured, the list is just the helper — exactly the
// behavior this app had before, so nothing can break by leaving it blank.
function videoSources(fileId){
  const id = encodeURIComponent(fileId);
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  if (key) {
    const apiUrl = 'https://www.googleapis.com/drive/v3/files/' + id +
                   '?alt=media&key=' + encodeURIComponent(key);
    list.push({ name: 'google-direct', url: apiUrl, crossOrigin: 'anonymous' });
    list.push({ name: 'google-direct-plain', url: apiUrl, crossOrigin: null });
  }
  const proxy = (CONFIG.VIDEO_PROXY_URL || '').trim();
  if (proxy) {
    list.push({
      name: 'free-proxy',
      url: proxy.replace(/\/+$/, '') + '/?id=' + id,
      crossOrigin: 'anonymous'
    });
  }
  list.push({ name: 'site-helper', url: '/watch-video?id=' + id, crossOrigin: null });
  return list;
}

// Once one of those methods has actually played a video on this TV, every
// later video that morning starts with that same method instead of walking
// the list again from the top. Without this, if the first method didn't work
// on this device, EVERY video a teacher pressed would sit there failing over
// for several seconds first — the difference between "instant" and "this
// thing is broken" from the front of a classroom.
let preferredSourceName = '';
try { preferredSourceName = localStorage.getItem('ktv_preferred_source') || ''; } catch(e) {}

function rememberPreferredSource(name){
  if (!name || name === preferredSourceName) return;
  preferredSourceName = name;
  try { localStorage.setItem('ktv_preferred_source', name); } catch(e) {}
}

function orderedVideoSources(fileId){
  const list = videoSources(fileId);
  const i = list.findIndex(s => s.name === preferredSourceName);
  if (i <= 0) return list; // not found, or already first — nothing to reorder
  return [list[i]].concat(list.slice(0, i)).concat(list.slice(i + 1));
}

// -------------------------------------------------------------------------
// FILE FORMATS A TV CAN AND CAN'T PLAY
// -------------------------------------------------------------------------
// The sync script records each file's real format in the Sheet. When a video
// fails, that lets the screen say the actual reason ("this is a .mov, TVs
// can't play those") instead of a generic shrug — which is the difference
// between a fixable problem and a mystery.
const FORMAT_NOTES = {
  'video/quicktime': 'This file is a QuickTime .mov. TVs usually can’t play those — it needs to be re-saved as an MP4.',
  'video/x-msvideo': 'This file is an .avi. TVs can’t play those — it needs to be re-saved as an MP4.',
  'video/x-ms-wmv':  'This file is a Windows .wmv. TVs can’t play those — it needs to be re-saved as an MP4.',
  'video/x-matroska':'This file is an .mkv. TVs usually can’t play those — it needs to be re-saved as an MP4.',
  'video/mpeg':      'This file is an old .mpg. TVs usually can’t play those — it needs to be re-saved as an MP4.',
  'video/3gpp':      'This file is a phone .3gp. TVs usually can’t play those — it needs to be re-saved as an MP4.'
};

function formatHintFor(mimeType){
  const t = (mimeType || '').trim().toLowerCase();
  if (!t) return '';
  if (FORMAT_NOTES[t]) return FORMAT_NOTES[t];
  if (t.indexOf('video/') !== 0) {
    return 'This isn’t a video file at all (Google says it’s ' + t + ') — it probably landed in the folder by mistake.';
  }
  return '';
}

let playerLoadTimeout = null;
// Bumped every time a video-load attempt starts or is abandoned (back button,
// a fresh video picked, etc). Each attempt's callbacks (error/timeout/canplay)
// close over the token they were created with and check it before doing
// anything — so a slow, stale callback from an attempt we've already moved
// past (or left entirely) can never step on a later, successful one. Without
// this guard, a delayed "error" event from an earlier failed link could fire
// after a later link had already started playing fine, and incorrectly
// advance past it or overwrite it with the error screen.
let playAttemptToken = 0;

// -------------------------------------------------------------------------
// PICTURE BUTTONS (memory-verse graphics, activity pages, anything Mom
// uploads as a JPG/PNG instead of a video)
// -------------------------------------------------------------------------
// Much simpler than video: a picture is small, loads as one piece (no
// seeking, no stalling mid-download, no codec/profile concerns — every
// browser decodes JPEG/PNG/WebP the same way), and a plain <img> tag has
// always been able to display a cross-origin picture without needing any
// CORS header at all (that's just how <img src="..."> has worked since the
// beginning of the web) — unlike <video>, which is why the video path above
// needs the whole fallback ladder and ORB workarounds in the first place. So
// this only needs two tries: Google's direct API link, then the same
// site-helper endpoint the video player falls back to, which works for any
// file type Google will hand it, not only videos.
function imageSources(fileId){
  const id = encodeURIComponent(fileId);
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  if (key) {
    list.push({ name: 'google-direct-image', url: 'https://www.googleapis.com/drive/v3/files/' + id + '?alt=media&key=' + encodeURIComponent(key) });
  }
  list.push({ name: 'site-helper-image', url: '/watch-video?id=' + id });
  return list;
}

function showImage(b){
  if (!b) return;
  currentView = 'player';
  menuEl.classList.remove('open');
  playerFrameWrap.innerHTML =
    '<img id="playerImage" alt="">' +
    '<div id="playerLoading" class="player-loading">' +
      '<div class="spinner"></div>' +
      '<p>Loading picture…</p>' +
    '</div>' +
    '<div id="playerError" class="player-error" hidden>' +
      '<div class="glyph">⚠️</div>' +
      '<p>This picture couldn’t load. Ask your director to check that the file is still shared as "Anyone with the link."</p>' +
      '<p class="err-detail" id="playerErrorDetail"></p>' +
    '</div>';
  const imgEl = document.getElementById('playerImage');
  const sources = imageSources(b.fileId);
  let sourceIndex = 0;
  const myToken = ++playAttemptToken;

  function hideLoadingIndicator(){
    const loading = document.getElementById('playerLoading');
    if (loading) loading.hidden = true;
  }

  function tryNextImageSource(lastErrorDetail){
    if (myToken !== playAttemptToken) return; // superseded — a Back press or a new picture moved on already
    if (sourceIndex >= sources.length) {
      showPlayerError(lastErrorDetail);
      return;
    }
    const src = sources[sourceIndex];
    sourceIndex++;
    imgEl.src = src.url;
  }

  imgEl.addEventListener('load', () => {
    if (myToken !== playAttemptToken) return;
    hideLoadingIndicator();
  });
  imgEl.addEventListener('error', () => {
    if (myToken !== playAttemptToken) return;
    tryNextImageSource('picture failed to load from ' + (sources[sourceIndex - 1] ? sources[sourceIndex - 1].name : 'source'));
  });

  tryNextImageSource();

  playerEl.classList.add('open');
  playerBackBtn.classList.add('focused'); // the only thing to press here, so show it as active right away
  showPlayerChrome();
  updatePlayerBackButtonLabel();
  startIdleTimer();
}

function playVideo(b){
  if (!b) return;
  currentView = 'player';
  menuEl.classList.remove('open');
  playerFrameWrap.innerHTML =
    '<video id="playerVideo" autoplay playsinline preload="auto"></video>' +
    '<div id="playerLoading" class="player-loading">' +
      '<div class="spinner"></div>' +
      '<p>Loading video…</p>' +
      '<p class="pct" id="playerLoadingPct"></p>' +
    '</div>' +
    '<div id="playerError" class="player-error" hidden>' +
      '<div class="glyph">⚠️</div>' +
      '<p id="playerErrorHeadline">This video couldn’t load. Ask your director to check that the file is still shared as "Anyone with the link."</p>' +
      '<p class="err-detail" id="playerErrorDetail"></p>' +
    '</div>';
  const videoEl = document.getElementById('playerVideo');
  const sources = orderedVideoSources(b.fileId);
  let sourceIndex = 0;
  let currentSourceName = '';
  const myToken = ++playAttemptToken;

  // Two very different questions, so two very different clocks:
  //
  //  * FIRST_BYTE_MS — "has this way of fetching the video produced ANY
  //    sign of life?" If a delivery method is simply not going to work on
  //    this TV (wrong key, blocked, whatever), waiting on it is pointless;
  //    give up quickly and try the next one. Kept short because there IS a
  //    next thing to try.
  //
  //  * STALL_MS — "bytes were flowing and then everything went quiet."
  //    Kept generous, because a video that's genuinely mid-download must
  //    never be cut off just for being slow. This is the mistake an earlier
  //    version made: a flat 6-second clock killed videos that were working
  //    fine, and the "failed" screen appeared over a video still happily
  //    downloading in the background.
  const FIRST_BYTE_MS = 9000;
  const STALL_MS = 20000;

  let sawBytes = false;   // this source has produced real data
  let hasPlayed = false;  // playback actually started — never restart after this

  function clearPlayTimer(){ clearTimeout(playerLoadTimeout); playerLoadTimeout = null; }

  // THE SIGNATURE OF A FILE THAT ISN'T SAVED FOR STREAMING
  // ------------------------------------------------------
  // An .mp4 keeps its index (the "moov atom" — the table telling a player
  // where every frame lives) either at the FRONT of the file or at the END.
  // Front = the browser reads ~30KB and starts playing immediately. End =
  // the browser must download the ENTIRE file before it can show one frame.
  // Most video editors write it at the end unless told otherwise, and a
  // 90MB lesson video like that will never start on classroom Wi-Fi.
  //
  // From inside the page that looks like this: the browser is actively
  // downloading (networkState === 2, NETWORK_LOADING) but has learned
  // nothing about the file yet (readyState === 0, HAVE_NOTHING). No error
  // is ever thrown — it just silently downloads forever.
  //
  // This matters enormously for what we do next: when THIS is the problem,
  // trying the other delivery methods is worthless (they hand over the same
  // bytes in the same order) and actively harmful — each retry downloads
  // another full copy of a 90MB file. So we stop, and say the true thing.
  function looksUnstreamable(){
    return videoEl.networkState === 2 /* NETWORK_LOADING */ && videoEl.readyState === 0 /* HAVE_NOTHING */;
  }

  // Deliberately worded to cover every cause of this exact symptom, not just
  // the most common one. The TV can tell that bytes are arriving and that it
  // still can't make sense of them; it can't be certain WHY (index at the end
  // of the file is by far the usual reason, but an unusual export can do it
  // too). Since the remedy is identical in every case — re-save the file with
  // the Mac tool and use that copy — the message names the remedy rather than
  // guessing at the cause. The diagnostic specifics go in the detail line.
  const UNSTREAMABLE_HEADLINE =
    'This video downloads, but the TV can\'t start playing it. The file needs to be re-saved ' +
    'in a TV-friendly way. Run "Make Videos TV-Ready" on it, then put that fixed copy in Drive ' +
    'and use it instead.';

  // A clock that nothing resets.
  //
  // This one exists because of a trap the other two fall into: both of them
  // are re-armed every time bytes arrive, and a file with its index at the
  // end delivers bytes CONSTANTLY — so the "stalled" clock is perpetually
  // reset and never fires, and the TV sits on the loading spinner forever
  // pulling down a 90MB file it will never manage to play. (Measured, not
  // guessed: 40 seconds of continuous download with the browser still
  // reporting it knows nothing about the video.)
  //
  // A file that IS saved for streaming puts its index in the first ~30KB,
  // so the browser announces the video's length within a second or so even
  // on poor Wi-Fi. Twelve seconds of bytes flowing with still no length
  // means the index isn't at the front, and no amount of further waiting
  // (or trying a different delivery method) will change that.
  const METADATA_MS = 12000;
  let metadataTimeout = null;
  function clearMetadataTimer(){ clearTimeout(metadataTimeout); metadataTimeout = null; }

  function armMetadataTimer(){
    clearMetadataTimer();
    metadataTimeout = setTimeout(() => {
      if (myToken !== playAttemptToken) return;
      if (videoEl.readyState > 0) return;     // the browser knows the video — fine
      if (!sawBytes || !looksUnstreamable()) return; // nothing arriving: the other clocks own this
      showPlayerError(
        'downloaded for ' + (METADATA_MS/1000) + 's from ' + currentSourceName +
          ' without ever reading the video\'s index',
        UNSTREAMABLE_HEADLINE
      );
    }, METADATA_MS);
  }

  function armFirstByteTimer(){
    clearPlayTimer();
    playerLoadTimeout = setTimeout(() => {
      if (myToken !== playAttemptToken) return;
      if (sawBytes) return; // it's alive after all — the stall timer owns it now
      // Downloading hard, but the browser still knows nothing about the file:
      // don't call this source dead — the metadata clock above owns this case.
      if (looksUnstreamable()) return;
      tryNextSource('no response from ' + currentSourceName + ' within ' + (FIRST_BYTE_MS/1000) + 's');
    }, FIRST_BYTE_MS);
  }

  function armStallTimer(){
    clearPlayTimer();
    playerLoadTimeout = setTimeout(() => {
      if (myToken !== playAttemptToken) return;
      if (videoEl.readyState >= 3) return; // enough buffered to keep playing — not stalled
      if (looksUnstreamable()) {
        // Bytes have been pouring in for 20 seconds and the browser STILL
        // can't tell us the video's length. That's the index-at-the-end
        // case above — no other source can fix it, so stop here rather than
        // downloading the same enormous file two more times.
        showPlayerError(
          'downloaded ' + (STALL_MS/1000) + 's of ' + currentSourceName + ' without ever reading the video\'s index',
          UNSTREAMABLE_HEADLINE
        );
        return;
      }
      tryNextSource('stalled — nothing arrived for ' + (STALL_MS/1000) + 's');
    }, STALL_MS);
  }

  function hideLoadingIndicator(){
    const loading = document.getElementById('playerLoading');
    if (loading) loading.hidden = true;
  }

  // Human-readable translations of the browser's own MediaError codes (see
  // https://developer.mozilla.org/docs/Web/API/MediaError/code). This is the
  // one piece of information that says WHICH kind of failure this is without
  // needing another round of screenshots: "network" means the bytes never
  // fully arrived; "decode" means they arrived but this TV couldn't play
  // what's inside the file (an export/codec problem with that one video);
  // "unsupported" often means the address didn't return a real video at all.
  const MEDIA_ERROR_HINTS = {
    1: 'playback was stopped before it finished loading',
    2: 'network error — the video stopped downloading partway through',
    3: 'decode error — the file downloaded but this TV could not play what\'s inside it',
    4: 'unsupported — the browser doesn\'t recognize this as a playable video'
  };

  function tryNextSource(lastErrorDetail){
    if (myToken !== playAttemptToken) return; // superseded — ignore

    // Once a video has genuinely started playing, never yank it back to try
    // a different address — at that point any error is a real failure worth
    // showing, not something a different delivery method would fix.
    if (hasPlayed) { showPlayerError(withFormatHint(lastErrorDetail)); return; }

    clearPlayTimer();
    if (sourceIndex >= sources.length) {
      showPlayerError(withFormatHint(lastErrorDetail));
      return;
    }
    const src = sources[sourceIndex];
    sourceIndex++;
    currentSourceName = src.name;
    sawBytes = false;
    // Whether we ask Google for explicit cross-site permission headers has to
    // be decided BEFORE the address is set, because the browser reads that
    // setting at the moment it starts fetching.
    if (src.crossOrigin) videoEl.setAttribute('crossorigin', src.crossOrigin);
    else videoEl.removeAttribute('crossorigin');
    videoEl.src = src.url;
    videoEl.load(); // clean reset of the element's load state before each try
    videoEl.play().catch(() => {});
    armFirstByteTimer();
    armMetadataTimer();
  }

  // Adds the specific "this is a .mov, TVs can't play those" style sentence
  // when the Sheet told us this file's real format and that format explains
  // the failure — far more useful than a bare error code.
  function withFormatHint(detail){
    const hint = formatHintFor(b.type);
    if (!hint) return detail;
    return (detail ? detail + ' · ' : '') + hint;
  }

  function noteBytesArrived(){
    if (myToken !== playAttemptToken) return;
    sawBytes = true;
    if (videoEl.readyState < 3) armStallTimer(); else clearPlayTimer();
  }

  // `loadeddata` fires as soon as the very first frame is decodable —
  // typically many seconds before `canplay`, which waits until Chrome thinks
  // it has enough buffered to keep going. Showing the frame at `loadeddata`
  // makes the video appear far sooner; playback continues buffering behind it.
  videoEl.addEventListener('loadeddata', () => {
    if (myToken !== playAttemptToken) return;
    hideLoadingIndicator();
    videoEl.play().catch(() => {});
  });
  // While the spinner is up, say how much has arrived. A number that keeps
  // climbing is the difference between "this is slow" and "this is broken" —
  // without it a 40-second load looks identical to a dead screen.
  videoEl.addEventListener('progress', () => {
    if (myToken !== playAttemptToken) return;
    const pct = document.getElementById('playerLoadingPct');
    if (!pct || !videoEl.duration || !videoEl.buffered.length) return;
    const secs = videoEl.buffered.end(videoEl.buffered.length - 1);
    const share = Math.min(100, Math.round((secs / videoEl.duration) * 100));
    pct.textContent = share > 0 ? (share + '% loaded') : '';
  });
  videoEl.addEventListener('progress', noteBytesArrived);
  videoEl.addEventListener('loadedmetadata', () => { clearMetadataTimer(); noteBytesArrived(); });
  videoEl.addEventListener('loadeddata', noteBytesArrived);
  videoEl.addEventListener('waiting', () => {
    // Buffering mid-playback: legitimate, but start the quiet-too-long clock
    // so a video that never recovers doesn't sit frozen forever.
    if (myToken !== playAttemptToken) return;
    armStallTimer();
  });
  videoEl.addEventListener('error', () => {
    if (myToken !== playAttemptToken) return;
    const mediaErr = videoEl.error;
    const detail = (mediaErr ? (MEDIA_ERROR_HINTS[mediaErr.code] || ('error code ' + mediaErr.code)) : 'unknown error')
                 + ' (' + currentSourceName + ')';
    console.error('[KidsTV] video error:', detail, mediaErr);
    tryNextSource(detail);
  });
  videoEl.addEventListener('pause', () => {
    if (myToken !== playAttemptToken) return;
    playerEl.classList.add('is-paused');
    showPlayerChrome();
  });
  videoEl.addEventListener('play', () => {
    if (myToken !== playAttemptToken) return;
    playerEl.classList.remove('is-paused');
  });
  videoEl.addEventListener('playing', () => {
    if (myToken !== playAttemptToken) return;
    hasPlayed = true;
    clearPlayTimer();
    clearMetadataTimer();
    hideLoadingIndicator();
    // This delivery method demonstrably works on this TV — start there for
    // every video pressed from now on instead of walking the list again.
    rememberPreferredSource(currentSourceName);
  });
  // Safety net: some browsers accept a .play() call made before any data has
  // loaded yet without actually resuming playback once the data does arrive.
  // Re-issuing .play() as soon as the element says it's ready to go costs
  // nothing if playback already started, and rescues it if it didn't.
  videoEl.addEventListener('canplay', () => {
    if (myToken !== playAttemptToken) return;
    hideLoadingIndicator();
    videoEl.play().catch(() => {});
  });
  // A finished video shouldn't leave a frozen last frame on the wall — go
  // back to the list the teacher picked it from, ready for the next one.
  videoEl.addEventListener('ended', () => {
    if (myToken !== playAttemptToken) return;
    if (CONFIG.RETURN_TO_MENU_WHEN_VIDEO_ENDS) showMenu();
  });
  tryNextSource();

  playerEl.classList.add('open');
  playerBackBtn.classList.add('focused'); // the only thing to press here, so show it as active right away
  showPlayerChrome();
  updatePlayerBackButtonLabel();
  startIdleTimer();
}

function showPlayerError(detail, headline){
  clearTimeout(playerLoadTimeout);
  const vid = document.getElementById('playerVideo');
  const loading = document.getElementById('playerLoading');
  const err = document.getElementById('playerError');
  const detailEl = document.getElementById('playerErrorDetail');
  const headlineEl = document.getElementById('playerErrorHeadline');
  if (headline && headlineEl) headlineEl.textContent = headline;
  // Actually stop playback here, not just hide it visually — otherwise a
  // video that keeps loading/playing in the background after this screen
  // shows (which is exactly what real testing turned up: audio audible
  // with the error message on screen) leaves teachers hearing sound from
  // a "broken" screen, which is more confusing than either working or
  // failing cleanly.
  // pause() alone only stops PLAYBACK — the browser happily keeps downloading
  // the rest of the file behind the error screen. Real measurement on the live
  // site: 80MB of a 92MB video still streaming in 70 seconds AFTER this screen
  // appeared, for a video that never showed a single frame. That is almost
  // certainly what drained the old host's monthly bandwidth allowance twice.
  // Clearing the source and calling load() is what actually cancels the fetch.
  if (vid) {
    vid.pause();
    vid.removeAttribute('src');
    try { vid.load(); } catch (e) {}
    vid.style.display = 'none';
  }
  if (loading) loading.hidden = true;
  if (err) err.hidden = false;
  if (detailEl) detailEl.textContent = detail ? ('Detail: ' + detail) : '';
}

/* ---------------------- Remote / keyboard navigation ----------------------
   Some kiosk browsers intercept the remote's hardware Back button entirely
   (routing it to their own admin menu) before it ever reaches this page, so
   Escape/Backspace/GoBack can't be relied on as the only way back. The
   on-screen corner back button is folded into the same arrow-key roving
   focus as the video/folder tiles — it's simply treated as one extra slot
   past the end of the grid — so a remote with only D-pad + OK can always
   reach it and press it, with no Back button or mouse required. */
function applyFocusVisual(){
  const btns = buttonGrid.querySelectorAll('.btn');
  const onBackSlot = focusedIndex >= btns.length;
  btns.forEach((el, i) => el.classList.toggle('focused', !onBackSlot && i === focusedIndex));
  menuCloseBtn.classList.toggle('focused', onBackSlot);
  const el = btns[focusedIndex];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ---------------------- The remote's own Back button ----------------------
   The onn remote's Back button never reaches this page as a key press — on
   Android TV the system swallows it and hands it to whichever app is running
   (here, the kiosk browser), so no amount of listening for a "Back" key will
   ever see it. What the kiosk browser DOES do with it, when its "Enable Back
   Button" setting is on (that one is free, not a paid extra), is the ordinary
   browser thing: go one step back in page history.

   So instead of trying to catch a key that never arrives, this keeps one
   spare history entry parked behind the page at all times. Pressing Back
   spends that spare entry, which fires the `popstate` event below — that's
   our signal — and we immediately park a fresh one so the next press works
   the same way. The page itself never actually goes anywhere, so Back can
   never accidentally exit the dashboard; it just walks up one level exactly
   like the on-screen corner button: out of a video to the list it came from,
   out of a week folder to the main menu, and from the main menu back to the
   screensaver. */
function goBackOneLevel(){
  if (currentView === 'player') { showMenu(); return; }
  if (currentView === 'menu') { handleMenuBack(); return; }
  // Already at the screensaver — there's nothing above it to go back to.
}

function parkSpareHistoryEntry(){
  try { history.pushState({ ktvSpare: true }, ''); } catch (e) {}
}

(function initHistoryBackButton(){
  try {
    history.replaceState({ ktvBase: true }, '');
    parkSpareHistoryEntry();
    window.addEventListener('popstate', () => {
      restartIdleTimerIfActive();
      goBackOneLevel();
      parkSpareHistoryEntry(); // re-arm so the next Back press works too
    });
  } catch (e) {
    // Very old/odd browsers without the history API: the on-screen back
    // button and the keys below still cover everything.
  }
})();

/* ==================== LOOK-AND-FEEL THEMES ====================
   Five complete colour schemes live in the stylesheet at the top of this file.
   Switching is deliberately hidden so it can't be triggered by accident during
   a lesson: press LEFT twice, quickly, while the screensaver is showing.
   The choice is saved per TV, so the Preschool room can look different from
   the Elementary room if you want.
   ============================================================= */
const THEMES = [
  { id: 'classic',      name: 'Classic Navy' },
  { id: 'sunshine',     name: 'Sunshine'     },
  { id: 'bubblegum',    name: 'Bubblegum'    },
  { id: 'jungle',       name: 'Jungle'       },
  { id: 'highcontrast', name: 'Big & Bold'   },
];

function currentThemeId(){
  try { return localStorage.getItem('ktv_theme') || 'classic'; } catch (e) { return 'classic'; }
}

function applyTheme(id, announce){
  const theme = THEMES.find(t => t.id === id) || THEMES[0];
  document.documentElement.setAttribute('data-theme', theme.id);
  try { localStorage.setItem('ktv_theme', theme.id); } catch (e) {}
  if (announce) showThemeToast(theme.name);
}

// A brief label so whoever is changing the theme can see which one they landed
// on. Disappears on its own; nothing to dismiss.
let themeToastTimer = null;
function showThemeToast(name){
  let el = document.getElementById('themeToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'themeToast';
    el.style.cssText = 'position:fixed;left:50%;bottom:8%;transform:translateX(-50%);z-index:60;' +
      'padding:14px 30px;border-radius:999px;background:rgba(0,0,0,0.78);border:2px solid var(--accent);' +
      'color:#fff;font-size:1.4rem;font-weight:700;letter-spacing:.4px;pointer-events:none;' +
      'transition:opacity .3s ease;box-shadow:0 10px 40px rgba(0,0,0,.6)';
    document.body.appendChild(el);
  }
  el.textContent = 'Theme: ' + name;
  el.style.opacity = '1';
  clearTimeout(themeToastTimer);
  themeToastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

function cycleTheme(){
  const i = THEMES.findIndex(t => t.id === currentThemeId());
  applyTheme(THEMES[(i + 1 + THEMES.length) % THEMES.length].id, true);
}

applyTheme(currentThemeId(), false); // restore this TV's saved look immediately

// Two LEFT presses within this window on the screensaver = change theme.
const THEME_GESTURE_MS = 1500;
let lastLeftPressAt = 0;

/* ==================== PLAYER CHROME (auto-hiding) ====================
   The back arrow and the one-line hint fade away a few seconds after the last
   remote press, and reappear instantly on the next one. While a video is
   paused they stay visible, because a frozen picture with no controls reads
   as "broken" rather than "paused".
   ==================================================================== */
const CHROME_HIDE_MS = 3500;
let chromeTimer = null;

function ensurePlayerChrome(){
  if (!document.getElementById('playerHint')) {
    const hint = document.createElement('div');
    hint.id = 'playerHint';
    hint.innerHTML = '<span class="k">OK</span> pause &nbsp;·&nbsp; <span class="k">Back</span> menu';
    playerEl.appendChild(hint);
  }
  if (!document.getElementById('pauseBadge')) {
    const badge = document.createElement('div');
    badge.id = 'pauseBadge';
    badge.innerHTML = '<div class="bars"><i></i><i></i></div>';
    playerEl.appendChild(badge);
  }
}

function showPlayerChrome(){
  ensurePlayerChrome();
  playerEl.classList.remove('chrome-hidden');
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => {
    const vid = document.getElementById('playerVideo');
    if (vid && vid.paused) return;              // stay visible while paused
    playerEl.classList.add('chrome-hidden');
  }, CHROME_HIDE_MS);
}

function hidePlayerChromeNow(){
  clearTimeout(chromeTimer);
  playerEl.classList.add('chrome-hidden');
}

// Only videos can pause. Pictures ignore OK entirely — pressing it should
// never look like it "did nothing wrong but nothing happened", so the chrome
// reappears as feedback.
function togglePlayPause(){
  const vid = document.getElementById('playerVideo');
  showPlayerChrome();
  if (!vid) return false;
  if (vid.paused) { vid.play().catch(() => {}); playerEl.classList.remove('is-paused'); }
  else { vid.pause(); playerEl.classList.add('is-paused'); }
  return true;
}

document.addEventListener('keydown', (e) => {
  restartIdleTimerIfActive();

  // Back-ish keys, across every remote/browser spelling we've seen. Android's
  // own back key is code 4; some TV browsers send Escape or a named GoBack.
  const isBackKey = ['Escape','Backspace','GoBack','BrowserBack'].includes(e.key) || e.keyCode === 4;

  if (currentView === 'screensaver') {
    if (isBackKey) return; // Back at the screensaver does nothing — already home
    // LEFT is reserved here as the hidden theme switch: two presses within a
    // second and a half cycle the colour scheme. A single LEFT does nothing,
    // which is why it can't be stumbled into — every OTHER key still wakes
    // the menu exactly as before.
    if (e.key === 'ArrowLeft') {
      const now = Date.now();
      if (now - lastLeftPressAt < THEME_GESTURE_MS) { cycleTheme(); lastLeftPressAt = 0; }
      else { lastLeftPressAt = now; }
      e.preventDefault();
      return;
    }
    lastLeftPressAt = 0;
    e.preventDefault();
    showMenu();
    return;
  }

  if (currentView === 'player') {
    showPlayerChrome(); // any remote press brings the controls back for a few seconds
    const vid = document.getElementById('playerVideo');
    // Left/right nudge through the video — handy for replaying a line of a
    // memory verse without starting the whole thing over.
    if (e.key === 'ArrowLeft' && vid) { vid.currentTime = Math.max(0, vid.currentTime - 10); e.preventDefault(); return; }
    if (e.key === 'ArrowRight' && vid) { vid.currentTime = vid.currentTime + 10; e.preventDefault(); return; }
    if ((e.key === 'MediaPlayPause' || e.key === 'MediaPause' || e.key === 'MediaPlay') && vid) {
      if (vid.paused) vid.play().catch(()=>{}); else vid.pause();
      e.preventDefault(); return;
    }
    // OK / Select is the pause button. This is the one key Android TV
    // guarantees will reach the page (BACK is filtered out by the browser
    // itself before web content ever sees it), so it carries the action a
    // teacher needs most while a video is on the wall.
    if (['Enter',' '].includes(e.key)) { togglePlayPause(); e.preventDefault(); return; }
    // Back-style keys leave the video. On a TV remote this only arrives if
    // the kiosk app forwards it (see the popstate handler below) — the
    // on-screen arrow is the guaranteed path.
    if (isBackKey) { e.preventDefault(); showMenu(); return; }
    return;
  }

  if (currentView === 'menu') {
    if (isBackKey) { handleMenuBack(); e.preventDefault(); return; }
    const cols = CONFIG.GRID_COLUMNS;
    const count = visibleItems.length; // slots 0..count-1 are tiles, slot `count` is the back button
    switch (e.key) {
      case 'ArrowRight':
        if (focusedIndex < count - 1) focusedIndex++;
        applyFocusVisual(); e.preventDefault(); break;
      case 'ArrowLeft':
        if (focusedIndex < count && focusedIndex > 0) focusedIndex--;
        applyFocusVisual(); e.preventDefault(); break;
      case 'ArrowDown':
        if (focusedIndex >= count) { /* already on the back button — nowhere further down */ }
        else if (focusedIndex + cols >= count) focusedIndex = count; // last row -> the back button
        else focusedIndex += cols;
        applyFocusVisual(); e.preventDefault(); break;
      case 'ArrowUp':
        if (focusedIndex >= count) focusedIndex = Math.max(0, count - 1); // back button -> last tile
        else focusedIndex = Math.max(0, focusedIndex - cols);
        applyFocusVisual(); e.preventDefault(); break;
      case 'Enter': case ' ':
        if (focusedIndex >= count) { handleMenuBack(); } else { activateItem(focusedIndex); }
        e.preventDefault(); break;
    }
  }
});

// Touch / click support (tapping the TV directly, or a mouse while testing on a Mac)
screensaverEl.addEventListener('click', () => { if (currentView === 'screensaver') showMenu(); });
menuCloseBtn.addEventListener('click', handleMenuBack);
playerBackBtn.addEventListener('click', showMenu);

/* ---------------------- Idle auto-return ---------------------- */
function startIdleTimer(){
  clearIdleTimer();
  if (CONFIG.IDLE_RETURN_MINUTES > 0) {
    idleTimer = setTimeout(showScreensaver, CONFIG.IDLE_RETURN_MINUTES * 60 * 1000);
  }
}
function clearIdleTimer(){ if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }
function restartIdleTimerIfActive(){ if (idleTimer) startIdleTimer(); }

/* ---------------------- Boot ----------------------
   Draw the list from the copy saved on this TV first, then refresh from the
   Google Sheet in the background. Fetching the Sheet takes a second or two on
   a cheap TV stick; without this, a teacher who walks up and presses the
   remote during those first seconds gets "Loading the lesson list…" and a
   blank grid. With it, the buttons are already there — and if the Wi-Fi
   happens to be down that morning, they're there anyway. */
(function bootFromCache(){
  try {
    const cached = JSON.parse(localStorage.getItem('ktv_last_good_config') || 'null');
    if (cached && cached.length) {
      buttons = cached;
      loadThumbnailsUpFront(buttons);
      renderButtons();
      updateMenuTitle();
      updateBackButtonLabel();
    }
  } catch (e) {}
})();

loadConfigFromSheet();
setInterval(loadConfigFromSheet, Math.max(1, CONFIG.REFRESH_MINUTES) * 60 * 1000);
</script>
</body>
</html>
