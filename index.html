//      TV and never touches our website, which makes it FREE (our website
//      host charges for every byte it serves) and faster, and it skips the
//      fragile business of reading Google's "can't scan this for viruses"
//      warning page entirely — the API just hands over the file. Two flavors
//      are tried, one asking Google's permission-to-share headers explicitly
//      and one not, because which of those a browser is happy with varies.
//
//   2. "site-helper" — our own /watch-video helper, which downloads the file
//      server-side and passes the bytes along. Always works, needs no key,
//      but every byte counts against our website host's monthly allowance.
//
// If no API key is configured, the list is just the helper — exactly the
// behavior this app had before, so nothing can break by leaving it blank.
function videoSources(fileId){
  const id = encodeURIComponent(fileId);
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  if (key) {
    const apiUrl = 'https://www.googleapis.com/drive/v3/files/' + id +
                   '?alt=media&key=' + encodeURIComponent(key);
    list.push({ name: 'google-direct', url: apiUrl, crossOrigin: 'anonymous' });
    list.push({ name: 'google-direct-plain', url: apiUrl, crossOrigin: null });
  }
  const proxy = (CONFIG.VIDEO_PROXY_URL || '').trim();
  if (proxy) {
    list.push({
      name: 'free-proxy',
      url: proxy.replace(/\/+$/, '') + '/?id=' + id,
      crossOrigin: 'anonymous'
    });
  }
  list.push({ name: 'site-helper', url: '/watch-video?id=' + id, crossOrigin: null });
  return list;
}

// Once one of those methods has actually played a video on this TV, every
// later video that morning starts with that same method instead of walking
// the list again from the top. Without this, if the first method didn't work
// on this device, EVERY video a teacher pressed would sit there failing over
// for several seconds first — the difference between "instant" and "this
// thing is broken" from the front of a classroom.
let preferredSourceName = '';
try { preferredSourceName = localStorage.getItem('ktv_preferred_source') || ''; } catch(e) {}

function rememberPreferredSource(name){
  if (!name || name === preferredSourceName) return;
  preferredSourceName = name;
  try { localStorage.setItem('ktv_preferred_source', name); } catch(e) {}
}

function orderedVideoSources(fileId){
  const list = videoSources(fileId);
  const i = list.findIndex(s => s.name === preferredSourceName);
  if (i <= 0) return list; // not found, or already first — nothing to reorder
  return [list[i]].concat(list.slice(0, i)).concat(list.slice(i + 1));
}

// -------------------------------------------------------------------------
// FILE FORMATS A TV CAN AND CAN'T PLAY
// -------------------------------------------------------------------------
// The sync script records each file's real format in the Sheet. When a video
// fails, that lets the screen say the actual reason ("this is a .mov, TVs
// can't play those") instead of a generic shrug — which is the difference
// between a fixable problem and a mystery.
const FORMAT_NOTES = {
  'video/quicktime': 'This file is a QuickTime .mov. TVs usually can’t play those — it needs to be re-saved as an MP4.',
  'video/x-msvideo': 'This file is an .avi. TVs can’t play those — it needs to be re-saved as an MP4.',
  'video/x-ms-wmv':  'This file is a Windows .wmv. TVs can’t play those — it needs to be re-saved as an MP4.',
  'video/x-matroska':'This file is an .mkv. TVs usually can’t play those — it needs to be re-saved as an MP4.',
  'video/mpeg':      'This file is an old .mpg. TVs usually can’t play those — it needs to be re-saved as an MP4.',
  'video/3gpp':      'This file is a phone .3gp. TVs usually can’t play those — it needs to be re-saved as an MP4.'
};

function formatHintFor(mimeType){
  const t = (mimeType || '').trim().toLowerCase();
  if (!t) return '';
  if (FORMAT_NOTES[t]) return FORMAT_NOTES[t];
  if (t.indexOf('video/') !== 0) {
    return 'This isn’t a video file at all (Google says it’s ' + t + ') — it probably landed in the folder by mistake.';
  }
  return '';
}

let playerLoadTimeout = null;

// Repeating timers owned by whatever is currently on the player screen. They
// have to be stopped explicitly: an interval left running after a teacher
// walks away is a slow leak that, over a Sunday morning of lesson after
// lesson, eventually makes the TV sluggish.
let playerTickers = [];
function clearPlayerTickers(){
  for (let i = 0; i < playerTickers.length; i++) clearInterval(playerTickers[i]);
  playerTickers = [];
}
// Bumped every time a video-load attempt starts or is abandoned (back button,
// a fresh video picked, etc). Each attempt's callbacks (error/timeout/canplay)
// close over the token they were created with and check it before doing
// anything — so a slow, stale callback from an attempt we've already moved
// past (or left entirely) can never step on a later, successful one. Without
// this guard, a delayed "error" event from an earlier failed link could fire
// after a later link had already started playing fine, and incorrectly
// advance past it or overwrite it with the error screen.
let playAttemptToken = 0;

// -------------------------------------------------------------------------
// PICTURE BUTTONS (memory-verse graphics, activity pages, anything Mom
// uploads as a JPG/PNG instead of a video)
// -------------------------------------------------------------------------
// Much simpler than video: a picture is small, loads as one piece (no
// seeking, no stalling mid-download, no codec/profile concerns — every
// browser decodes JPEG/PNG/WebP the same way), and a plain <img> tag has
// always been able to display a cross-origin picture without needing any
// CORS header at all (that's just how <img src="..."> has worked since the
// beginning of the web) — unlike <video>, which is why the video path above
// needs the whole fallback ladder and ORB workarounds in the first place. So
// this only needs two tries: Google's direct API link, then the same
// site-helper endpoint the video player falls back to, which works for any
// file type Google will hand it, not only videos.
function imageSources(fileId){
  const id = encodeURIComponent(fileId);
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  if (key) {
    list.push({ name: 'google-direct-image', url: 'https://www.googleapis.com/drive/v3/files/' + id + '?alt=media&key=' + encodeURIComponent(key) });
  }
  list.push({ name: 'site-helper-image', url: '/watch-video?id=' + id });
  return list;
}

// Songs are fetched the same way pictures are — the API key first, the
// site's own helper address as the fallback.
function audioSources(fileId){
  const id = encodeURIComponent(fileId);
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  if (key) {
    list.push({ name: 'google-direct-audio', url: 'https://www.googleapis.com/drive/v3/files/' + id + '?alt=media&key=' + encodeURIComponent(key) });
  }
  list.push({ name: 'site-helper-audio', url: '/watch-video?id=' + id });
  return list;
}

function showImage(b){
  pauseWarming();   // nothing on the menu is about to be pressed
  if (!b) return;
  currentView = 'player';
  parkScreensaver();
  menuEl.classList.remove('open');
  playerFrameWrap.innerHTML =
    '<img id="playerImage" alt="">' +
    '<div id="playerLoading" class="player-loading">' +
      '<div class="spinner"></div>' +
      '<p>Loading picture…</p>' +
    '</div>' +
    '<div id="playerError" class="player-error" hidden>' +
      '<div class="glyph">⚠️</div>' +
      '<p>This picture couldn’t load. Ask your director to check that the file is still shared as "Anyone with the link."</p>' +
      '<p class="err-detail" id="playerErrorDetail"></p>' +
    '</div>';
  const imgEl = document.getElementById('playerImage');
  const sources = imageSources(b.fileId);
  let sourceIndex = 0;
  const myToken = ++playAttemptToken;

  function hideLoadingIndicator(){
    const loading = document.getElementById('playerLoading');
    if (loading) loading.hidden = true;
  }

  // A PICTURE NEEDS A CLOCK TOO.
  //
  // Videos have three. Pictures had none — the only way past the spinner was
  // an `error` event, and a request that HANGS rather than fails never fires
  // one. A memory verse could sit on "Loading picture…" indefinitely with the
  // second address never tried. Ten seconds is generous: these are a couple
  // of megabytes at most.
  const IMAGE_TIMEOUT_MS = 10000;
  let imageTimer = null;
  function clearImageTimer(){ clearTimeout(imageTimer); imageTimer = null; }

  function tryNextImageSource(lastErrorDetail){
    if (myToken !== playAttemptToken) return; // superseded — a Back press or a new picture moved on already
    clearImageTimer();
    if (sourceIndex >= sources.length) {
      showPlayerError(lastErrorDetail);
      return;
    }
    const src = sources[sourceIndex];
    sourceIndex++;
    imgEl.src = src.url;
    imageTimer = setTimeout(() => {
      if (myToken !== playAttemptToken) return;
      tryNextImageSource('no answer from ' + src.name + ' within ' + (IMAGE_TIMEOUT_MS/1000) + 's');
    }, IMAGE_TIMEOUT_MS);
  }

  imgEl.addEventListener('load', () => {
    if (myToken !== playAttemptToken) return;
    clearImageTimer();
    hideLoadingIndicator();
  });
  imgEl.addEventListener('error', () => {
    if (myToken !== playAttemptToken) return;
    tryNextImageSource('picture failed to load from ' + (sources[sourceIndex - 1] ? sources[sourceIndex - 1].name : 'source'));
  });

  tryNextImageSource();

  playerEl.classList.add('open');
  playerBackBtn.classList.add('focused'); // the only thing to press here, so show it as active right away
  showPlayerChrome();
  updatePlayerBackButtonLabel();
  startIdleTimer();
}

function playVideo(b){
  if (!b) return;
  currentView = 'player';
  parkScreensaver();
  menuEl.classList.remove('open');
  // If the menu already fetched this video's index, take that element and put
  // it on screen — the index comes with it, so there is nothing to wait for.
  const warmEl = takeWarmVideo(b.fileId);
  pauseWarming();   // the lesson gets the Wi-Fi to itself from here
  playerFrameWrap.innerHTML =
    (warmEl ? '' : '<video id="playerVideo" autoplay playsinline preload="auto"></video>') +
    '<div id="playerLoading" class="player-loading">' +
      '<div class="spinner"></div>' +
      '<p>Loading video…</p>' +
      '<p class="pct" id="playerLoadingPct"></p>' +
    '</div>' +
    '<div id="playerError" class="player-error" hidden>' +
      '<div class="glyph">⚠️</div>' +
      '<p id="playerErrorHeadline">This video couldn’t load. Ask your director to check that the file is still shared as "Anyone with the link."</p>' +
      '<p class="err-detail" id="playerErrorDetail"></p>' +
    '</div>';
  if (warmEl) {
    warmEl.id = 'playerVideo';
    warmEl.setAttribute('autoplay', '');
    warmEl.setAttribute('playsinline', '');
    warmEl.preload = 'auto';        // it has the index; now let it buffer frames
    warmEl.muted = false;           // it was muted only so warming stayed silent
    playerFrameWrap.insertBefore(warmEl, playerFrameWrap.firstChild);
  }
  const videoEl = document.getElementById('playerVideo');
  const sources = orderedVideoSources(b.fileId);
  // A warmed element is already on source 0 and already holds its index, so
  // the ladder starts at 1 — the next thing to try if this one goes wrong.
  let sourceIndex = warmEl ? 1 : 0;
  let currentSourceName = warmEl && sources.length ? sources[0].name : '';
  const myToken = ++playAttemptToken;

  // Two very different questions, so two very different clocks:
  //
  //  * FIRST_BYTE_MS — "has this way of fetching the video produced ANY
  //    sign of life?" If a delivery method is simply not going to work on
  //    this TV (wrong key, blocked, whatever), waiting on it is pointless;
  //    give up quickly and try the next one. Kept short because there IS a
  //    next thing to try.
  //
  //  * STALL_MS — "bytes were flowing and then everything went quiet."
  //    Kept generous, because a video that's genuinely mid-download must
  //    never be cut off just for being slow. This is the mistake an earlier
  //    version made: a flat 6-second clock killed videos that were working
  //    fine, and the "failed" screen appeared over a video still happily
  //    downloading in the background.
  const FIRST_BYTE_MS = 9000;
  const STALL_MS = 20000;

  // How many full passes through the delivery list we are willing to make.
  // Three is enough to ride out a momentary hiccup without leaving a teacher
  // staring at a spinner: worst case roughly a few extra seconds.
  const LADDER_ATTEMPTS = 3;
  let ladderAttempt = 0;

  let sawBytes = false;   // this source has produced real data
  let hasPlayed = false;  // playback actually started — never restart after this
  // How many times we will quietly nudge a stuttering video back to life
  // before admitting defeat. Each nudge costs nothing and buys 20 seconds.
  const RESUME_ATTEMPTS = 3;
  let resumeAttempts = 0;

  function clearPlayTimer(){ clearTimeout(playerLoadTimeout); playerLoadTimeout = null; }

  // THE SIGNATURE OF A FILE THAT ISN'T SAVED FOR STREAMING
  // ------------------------------------------------------
  // An .mp4 keeps its index (the "moov atom" — the table telling a player
  // where every frame lives) either at the FRONT of the file or at the END.
  // Front = the browser reads ~30KB and starts playing immediately. End =
  // the browser must download the ENTIRE file before it can show one frame.
  // Most video editors write it at the end unless told otherwise, and a
  // 90MB lesson video like that will never start on classroom Wi-Fi.
  //
  // From inside the page that looks like this: the browser is actively
  // downloading (networkState === 2, NETWORK_LOADING) but has learned
  // nothing about the file yet (readyState === 0, HAVE_NOTHING). No error
  // is ever thrown — it just silently downloads forever.
  //
  // This matters enormously for what we do next: when THIS is the problem,
  // trying the other delivery methods is worthless (they hand over the same
  // bytes in the same order) and actively harmful — each retry downloads
  // another full copy of a 90MB file. So we stop, and say the true thing.
  function looksUnstreamable(){
    return videoEl.networkState === 2 /* NETWORK_LOADING */ && videoEl.readyState === 0 /* HAVE_NOTHING */;
  }

  // Deliberately worded to cover every cause of this exact symptom, not just
  // the most common one. The TV can tell that bytes are arriving and that it
  // still can't make sense of them; it can't be certain WHY (index at the end
  // of the file is by far the usual reason, but an unusual export can do it
  // too). Since the remedy is identical in every case — re-save the file with
  // the Mac tool and use that copy — the message names the remedy rather than
  // guessing at the cause. The diagnostic specifics go in the detail line.
  const UNSTREAMABLE_HEADLINE =
    'This video is taking too long to start. It may just be a slow moment on the ' +
    'Wi-Fi — try it again. If it keeps happening on the same video, that file needs ' +
    're-saving: run "Fix Videos For TV" on it and put the fixed copy in Drive.';

  // A clock that nothing resets.
  //
  // This one exists because of a trap the other two fall into: both of them
  // are re-armed every time bytes arrive, and a file with its index at the
  // end delivers bytes CONSTANTLY — so the "stalled" clock is perpetually
  // reset and never fires, and the TV sits on the loading spinner forever
  // pulling down a 90MB file it will never manage to play. (Measured, not
  // guessed: 40 seconds of continuous download with the browser still
  // reporting it knows nothing about the video.)
  //
  // HOW LONG TO WAIT, AND WHY IT DEPENDS ON THE FILE'S SIZE
  // ------------------------------------------------------
  // A file saved for streaming puts its index in the first ~30KB, so the
  // browser announces the video's length almost immediately. A file with the
  // index at the END can never announce it at all. In between sits the case
  // that was causing false alarms: a BIG file, correctly saved, whose index
  // is itself several megabytes — on a slow moment of church Wi-Fi even the
  // front of the file takes a while to arrive. A flat twelve-second clock
  // accused those perfectly good 200MB+ videos of being broken, which is
  // exactly the intermittent error that shows up four times out of twenty.
  //
  // So the allowance scales with the size the Sheet reports: a floor of 20
  // seconds, plus 150ms per megabyte, capped at 75 so nothing waits forever.
  //   20MB  → 23s      92MB  → 34s
  //   164MB → 45s      280MB → 62s
  // A file that is genuinely unstreamable still gets caught; a big file on a
  // bad minute now gets the time it actually needs.
  const sizeMb = Math.max(0, Math.min(500, Number(b && b.sizeMb) || 0));
  // MEASURED, and it overturned the obvious answer. The index is 36 bytes per
  // FRAME, so a 30-minute video carries a ~1.9MB index whether the file is
  // 267MB or 60MB — identical wait, identical everything. Judging patience by
  // file size (as this did) is wrong both ways round: too impatient with a
  // long slim file, too slow to report a short fat one that is genuinely bad.
  //
  //   index ≈ 65KB per minute of video
  //   allow ~1s per minute — roughly three times what even bad Wi-Fi needs —
  //   on top of 10s for the connection itself.
  const stated = Math.max(0, Number(b && b.minutes) || 0);
  // Older sheets have no Minutes column: fall back to estimating from size at
  // roughly 9MB per minute, which is what this curriculum's files run at.
  const minutes = Math.min(150, stated || (sizeMb / 9));
  // The floor is 20s, not 10s: with neither column filled in, `minutes` is 0,
  // and a 10-second budget is one second after the first-byte clock stands
  // down — which would accuse perfectly good large videos of being broken on
  // any sheet that hasn't been re-synced yet.
  const METADATA_MS = Math.min(75000, 20000 + minutes * 1000);
  let metadataTimeout = null;
  function clearMetadataTimer(){ clearTimeout(metadataTimeout); metadataTimeout = null; }
  function metadataClockRunning(){ return metadataTimeout !== null; }

  function armMetadataTimer(){
    clearMetadataTimer();
    metadataTimeout = setTimeout(() => {
      metadataTimeout = null;
      if (myToken !== playAttemptToken) return;
      if (videoEl.readyState > 0) return;     // the browser knows the video — fine
      // NOTHING GETS PAST THIS CLOCK. It used to step aside whenever no bytes
      // had arrived, on the reasoning that the other clocks owned that case —
      // but as the trace above showed, they could all end up deferring to one
      // another and leaving a class watching a spinner. If this fires and the
      // browser still knows nothing about the video, something is wrong
      // whatever the cause, so this is the last word.
      if (!sawBytes) {
        // Never received a thing: that is a dead address, not a bad file.
        tryNextSource('nothing at all arrived from ' + currentSourceName +
                      ' within ' + Math.round(METADATA_MS/1000) + 's');
        return;
      }
      if (!looksUnstreamable()) { tryNextSource('gave up waiting on ' + currentSourceName); return; }
      showPlayerError(
        'downloaded for ' + Math.round(METADATA_MS/1000) + 's from ' + currentSourceName +
          ' (' + (minutes ? (Math.round(minutes * 10) / 10) + ' min' : 'unknown length') +
          (stated ? '' : ', estimated') + ') without ever reading the video\'s index',
        UNSTREAMABLE_HEADLINE
      );
    }, METADATA_MS);
  }

  function armFirstByteTimer(){
    clearPlayTimer();
    playerLoadTimeout = setTimeout(() => {
      if (myToken !== playAttemptToken) return;
      if (sawBytes) return; // it's alive after all — the stall timer owns it now
      // Downloading hard, but the browser still knows nothing about the file:
      // don't call this source dead — the metadata clock above owns this case.
      //
      // THE `sawBytes &&` HERE IS LOad-BEARING. Without it, a connection that
      // is accepted but never sends a single byte — ten TVs hitting one API
      // key, a wedged access point — falls between the two clocks: this one
      // steps aside because the browser is "loading", and the metadata clock
      // refuses it because no bytes ever arrived. Nobody fires, no other
      // address is ever tried, and a class watches a spinner until the idle
      // timer rescues them. The handover is only valid when data is flowing.
      if (sawBytes && looksUnstreamable()) return;
      tryNextSource('no response from ' + currentSourceName + ' within ' + (FIRST_BYTE_MS/1000) + 's');
    }, FIRST_BYTE_MS);
  }

  function armStallTimer(){
    clearPlayTimer();
    playerLoadTimeout = setTimeout(() => {
      if (myToken !== playAttemptToken) return;
      if (videoEl.readyState >= 3) return; // enough buffered to keep playing — not stalled
      if (looksUnstreamable()) {
        // Bytes are pouring in and the browser still can't tell us the
        // video's length. That is the index-at-the-end signature — but on a
        // big file it is ALSO just what a slow minute looks like, so this
        // clock does not get to make the call. The size-aware metadata clock
        // owns this case; stay quiet while it is still running.
        if (metadataClockRunning()) return;
        showPlayerError(
          'downloaded ' + (STALL_MS/1000) + 's of ' + currentSourceName + ' without ever reading the video\'s index',
          UNSTREAMABLE_HEADLINE
        );
        return;
      }
      tryNextSource('stalled — nothing arrived for ' + (STALL_MS/1000) + 's');
    }, STALL_MS);
  }

  function hideLoadingIndicator(){
    const loading = document.getElementById('playerLoading');
    if (loading) loading.hidden = true;
  }

  // Human-readable translations of the browser's own MediaError codes (see
  // https://developer.mozilla.org/docs/Web/API/MediaError/code). This is the
  // one piece of information that says WHICH kind of failure this is without
  // needing another round of screenshots: "network" means the bytes never
  // fully arrived; "decode" means they arrived but this TV couldn't play
  // what's inside the file (an export/codec problem with that one video);
  // "unsupported" often means the address didn't return a real video at all.
  const MEDIA_ERROR_HINTS = {
    1: 'playback was stopped before it finished loading',
    2: 'network error — the video stopped downloading partway through',
    3: 'decode error — the file downloaded but this TV could not play what\'s inside it',
    4: 'unsupported — the browser doesn\'t recognize this as a playable video'
  };

  function tryNextSource(lastErrorDetail){
    if (myToken !== playAttemptToken) return; // superseded — ignore

    // Once a video has genuinely started playing, never yank it back to try
    // a different address — at that point any error is a real failure worth
    // showing, not something a different delivery method would fix.
    // ALREADY PLAYING: this is a rebuffer, not a failure.
    //
    // A twenty-second Wi-Fi dip twenty minutes into a Bible story used to
    // land here and tear the video down — src removed, download cancelled,
    // "check that the file is shared" on the wall — for a video that would
    // have recovered on its own a moment later. Nudge it instead, and only
    // give up if nudging repeatedly gets us nowhere.
    if (hasPlayed) {
      if (resumeAttempts < RESUME_ATTEMPTS) {
        resumeAttempts++;
        videoEl.play().catch(() => {});
        armStallTimer();
        return;
      }
      showPlayerError(withFormatHint(lastErrorDetail) + ' · after ' + RESUME_ATTEMPTS + ' attempts to resume');
      return;
    }

    clearPlayTimer();
    if (sourceIndex >= sources.length) {
      // EVERY DELIVERY METHOD FAILED — BUT TRY THE WHOLE LIST AGAIN BEFORE
      // TELLING ANYONE.
      //
      // Ten televisions pulling 200MB files from the same Google account will
      // occasionally be told "not right now": a brief rate-limit, a dropped
      // connection, a moment of bad Wi-Fi. Google answers those with something
      // that isn't video, and the browser reports it as "unsupported" — which
      // looks identical to a genuinely broken file but isn't one. It is the
      // reason a video plays four times out of five.
      //
      // A blip has passed within a second or two, so rather than put an error
      // on a classroom wall, wait briefly and walk the whole list again. Only
      // if it fails EVERY time does something real get reported.
      if (ladderAttempt < LADDER_ATTEMPTS - 1) {
        ladderAttempt++;
        sourceIndex = 0;
        sawBytes = false;
        const wait = 1200 * ladderAttempt;   // a beat longer each time
        playerLoadTimeout = setTimeout(() => {
          if (myToken !== playAttemptToken) return;
          tryNextSource('retrying after: ' + (lastErrorDetail || 'no response'));
        }, wait);
        return;
      }
      // Say how hard we tried. When a director sends a photo of this screen,
      // "after 3 attempts" is the difference between "the Wi-Fi hiccuped" and
      // "this file is actually wrong", which are opposite fixes.
      showPlayerError(withFormatHint(lastErrorDetail) +
                      ' · still failing after ' + LADDER_ATTEMPTS + ' attempts');
      return;
    }
    const src = sources[sourceIndex];
    sourceIndex++;
    currentSourceName = src.name;
    sawBytes = false;
    // Whether we ask Google for explicit cross-site permission headers has to
    // be decided BEFORE the address is set, because the browser reads that
    // setting at the moment it starts fetching.
    if (src.crossOrigin) videoEl.setAttribute('crossorigin', src.crossOrigin);
    else videoEl.removeAttribute('crossorigin');
    videoEl.src = src.url;
    videoEl.load(); // clean reset of the element's load state before each try
    videoEl.play().catch(() => {});
    armFirstByteTimer();
    armMetadataTimer();
  }

  // Adds the specific "this is a .mov, TVs can't play those" style sentence
  // when the Sheet told us this file's real format and that format explains
  // the failure — far more useful than a bare error code.
  function withFormatHint(detail){
    const hint = formatHintFor(b.type);
    if (!hint) return detail;
    return (detail ? detail + ' · ' : '') + hint;
  }

  function noteBytesArrived(){
    if (myToken !== playAttemptToken) return;
    sawBytes = true;
    if (videoEl.readyState < 3) armStallTimer(); else clearPlayTimer();
  }

  // `loadeddata` fires as soon as the very first frame is decodable —
  // typically many seconds before `canplay`, which waits until Chrome thinks
  // it has enough buffered to keep going. Showing the frame at `loadeddata`
  // makes the video appear far sooner; playback continues buffering behind it.
  videoEl.addEventListener('loadeddata', () => {
    if (myToken !== playAttemptToken) return;
    hideLoadingIndicator();
    videoEl.play().catch(() => {});
  });
  // While the spinner is up, say how much has arrived. A number that keeps
  // climbing is the difference between "this is slow" and "this is broken" —
  // without it a 40-second load looks identical to a dead screen.
  videoEl.addEventListener('progress', () => {
    if (myToken !== playAttemptToken) return;
    const pct = document.getElementById('playerLoadingPct');
    if (!pct || !videoEl.duration || !videoEl.buffered.length) return;
    const secs = videoEl.buffered.end(videoEl.buffered.length - 1);
    const share = Math.min(100, Math.round((secs / videoEl.duration) * 100));
    if (share > 0) { pctShown = true; pct.textContent = share + '% loaded'; }
  });

  // BEFORE a percentage is possible, still say something true.
  //
  // The percentage above needs the video's length, and the video's length is
  // exactly what a big file on slow Wi-Fi hasn't told us yet — so in the one
  // situation where a teacher most needs reassurance, the spinner used to sit
  // there with no text at all for the better part of a minute. A room full of
  // children reads that as broken and someone reaches for the remote.
  //
  // So while we're waiting, count seconds and say plainly what's happening.
  const loadStartedAt = Date.now();
  let pctShown = false;
  const loadingTicker = setInterval(() => {
    if (myToken !== playAttemptToken) { clearInterval(loadingTicker); return; }
    const pct = document.getElementById('playerLoadingPct');
    const loading = document.getElementById('playerLoading');
    if (!pct || !loading || loading.hidden) { clearInterval(loadingTicker); return; }
    if (pctShown) return;                      // a real number beats a guess
    const secs = Math.round((Date.now() - loadStartedAt) / 1000);
    if (secs < 6) return;                      // don't nag about a normal wait
    pct.textContent = secs < 16
      ? 'Still loading…'
      : 'Still loading — this is a large video, it can take up to a minute.';
  }, 1000);
  playerTickers.push(loadingTicker);
  videoEl.addEventListener('progress', noteBytesArrived);
  videoEl.addEventListener('loadedmetadata', () => { clearMetadataTimer(); noteBytesArrived(); });
  videoEl.addEventListener('loadeddata', noteBytesArrived);
  videoEl.addEventListener('waiting', () => {
    // Buffering mid-playback: legitimate, but start the quiet-too-long clock
    // so a video that never recovers doesn't sit frozen forever.
    //
    // THE `sawBytes` GUARD IS THE WHOLE POINT. Chrome fires `waiting` about
    // three seconds in on ANY load, before a single byte has arrived — and
    // arming the stall clock here quietly cancelled the nine-second
    // first-byte clock that was the only thing watching for a connection
    // that opens and then says nothing. Every later clock then deferred to
    // another, and the spinner ran forever. Traced live: emptied, waiting,
    // loadstart, stalled — and no progress event, ever.
    if (myToken !== playAttemptToken) return;
    if (!sawBytes) return;   // nothing has arrived yet: the first-byte clock still owns this
    armStallTimer();
  });
  // The browser's own "I asked for data and none is coming" event. It is the
  // most direct signal there is that a source is dead, and it was going
  // unused: in the traced failure it fired at 6.1s while everything else sat
  // waiting for timers that would never do anything.
  const STALLED_GRACE_MS = 6000;
  videoEl.addEventListener('stalled', () => {
    if (myToken !== playAttemptToken) return;
    if (sawBytes || hasPlayed) return;         // mid-download hiccup: the other clocks own it
    if (videoEl.readyState > 0) return;        // it knows the video; not a dead source
    // Chrome can fire `stalled` about three seconds into a perfectly healthy
    // load. Giving a source at least six seconds to produce its first byte
    // means a slow start is never mistaken for a dead connection — and the
    // nine-second first-byte clock is still there behind this either way.
    if (Date.now() - loadStartedAt < STALLED_GRACE_MS) return;
    tryNextSource('no data at all from ' + currentSourceName + ' (the connection went quiet)');
  });
  videoEl.addEventListener('error', () => {
    if (myToken !== playAttemptToken) return;
    const mediaErr = videoEl.error;
    const detail = (mediaErr ? (MEDIA_ERROR_HINTS[mediaErr.code] || ('error code ' + mediaErr.code)) : 'unknown error')
                 + ' (' + currentSourceName + ')';
    console.error('[KidsTV] video error:', detail, mediaErr);
    tryNextSource(detail);
  });
  videoEl.addEventListener('pause', () => {
    if (myToken !== playAttemptToken) return;
    playerEl.classList.add('is-paused');
    showPlayerChrome();
  });
  videoEl.addEventListener('play', () => {
    if (myToken !== playAttemptToken) return;
    playerEl.classList.remove('is-paused');
  });
  videoEl.addEventListener('playing', () => {
    if (myToken !== playAttemptToken) return;
    hasPlayed = true;
    clearPlayTimer();
    clearMetadataTimer();
    hideLoadingIndicator();
    // This delivery method demonstrably works on this TV — start there for
    // every video pressed from now on instead of walking the list again.
    rememberPreferredSource(currentSourceName);
  });
  // Safety net: some browsers accept a .play() call made before any data has
  // loaded yet without actually resuming playback once the data does arrive.
  // Re-issuing .play() as soon as the element says it's ready to go costs
  // nothing if playback already started, and rescues it if it didn't.
  videoEl.addEventListener('canplay', () => {
    if (myToken !== playAttemptToken) return;
    hideLoadingIndicator();
    videoEl.play().catch(() => {});
  });
  // Record how long this actually took on THIS television. Guessing at church
  // Wi-Fi from a laptop somewhere else is how you end up fixing the wrong
  // thing; the speed screen reads these back.
  // A warmed-up element has ALREADY fired loadeddata — before this listener
  // existed — so listening alone would silently miss the very case this is
  // meant to prove. Record whichever happens: the event, or the fact that it
  // has already happened.
  let startRecorded = false;
  function recordStart(){
    if (startRecorded || myToken !== playAttemptToken) return;
    startRecorded = true;
    noteStartTime(b.label, Date.now() - loadStartedAt, !!warmEl);
  }
  videoEl.addEventListener('loadeddata', recordStart);
  if (videoEl.readyState >= 2) recordStart();
  // A finished video shouldn't leave a frozen last frame on the wall — go
  // back to the list the teacher picked it from, ready for the next one.
  videoEl.addEventListener('ended', () => {
    if (myToken !== playAttemptToken) return;
    if (CONFIG.RETURN_TO_MENU_WHEN_VIDEO_ENDS) showMenu();
  });
  if (warmEl) {
    // Already loaded — skip straight past the ladder's "set the address and
    // start downloading" step and just play it.
    videoEl.play().catch(() => {});
    armFirstByteTimer();
    armMetadataTimer();
    if (videoEl.readyState >= 1) noteBytesArrived();
    if (videoEl.readyState >= 2) hideLoadingIndicator();
  } else {
    tryNextSource();
  }

  playerEl.classList.add('open');
  playerBackBtn.classList.add('focused'); // the only thing to press here, so show it as active right away
  showPlayerChrome();
  updatePlayerBackButtonLabel();
  startIdleTimer();
}

function showPlayerError(detail, headline){
  clearTimeout(playerLoadTimeout);
  clearPlayerTickers();
  const vid = document.getElementById('playerVideo');
  const loading = document.getElementById('playerLoading');
  const err = document.getElementById('playerError');
  const detailEl = document.getElementById('playerErrorDetail');
  const headlineEl = document.getElementById('playerErrorHeadline');
  if (headline && headlineEl) headlineEl.textContent = headline;
  // Actually stop playback here, not just hide it visually — otherwise a
  // video that keeps loading/playing in the background after this screen
  // shows (which is exactly what real testing turned up: audio audible
  // with the error message on screen) leaves teachers hearing sound from
  // a "broken" screen, which is more confusing than either working or
  // failing cleanly.
  // pause() alone only stops PLAYBACK — the browser happily keeps downloading
  // the rest of the file behind the error screen. Real measurement on the live
  // site: 80MB of a 92MB video still streaming in 70 seconds AFTER this screen
  // appeared, for a video that never showed a single frame. That is almost
  // certainly what drained the old host's monthly bandwidth allowance twice.
  // Clearing the source and calling load() is what actually cancels the fetch.
  if (vid) {
    vid.pause();
    vid.removeAttribute('src');
    try { vid.load(); } catch (e) {}
    vid.style.display = 'none';
  }
  if (loading) loading.hidden = true;
  if (err) err.hidden = false;
  if (detailEl) detailEl.textContent = detail ? ('Detail: ' + detail) : '';
}

/* ---------------------- Remote / keyboard navigation ----------------------
   Some kiosk browsers intercept the remote's hardware Back button entirely
   (routing it to their own admin menu) before it ever reaches this page, so
   Escape/Backspace/GoBack can't be relied on as the only way back. The
   on-screen corner back button is folded into the same arrow-key roving
   focus as the video/folder tiles — it's simply treated as one extra slot
   past the end of the grid — so a remote with only D-pad + OK can always
   reach it and press it, with no Back button or mouse required. */
function applyFocusVisual(){
  const btns = buttonGrid.querySelectorAll('.btn');
  const onBackSlot = focusedIndex >= btns.length;
  btns.forEach((el, i) => el.classList.toggle('focused', !onBackSlot && i === focusedIndex));
  menuCloseBtn.classList.toggle('focused', onBackSlot);
  const el = btns[focusedIndex];
  if (el) el.scrollIntoView({ block: 'nearest' });
  prefetchFocusedTile();   // pictures: fetch whatever is under the cursor
  scheduleWarming();       // videos: put the tile under the cursor first in line
}

/* ---------------------- The remote's own Back button ----------------------
   The onn remote's Back button never reaches this page as a key press — on
   Android TV the system swallows it and hands it to whichever app is running
   (here, the kiosk browser), so no amount of listening for a "Back" key will
   ever see it. What the kiosk browser DOES do with it, when its "Enable Back
   Button" setting is on (that one is free, not a paid extra), is the ordinary
   browser thing: go one step back in page history.

   So instead of trying to catch a key that never arrives, this keeps one
   spare history entry parked behind the page at all times. Pressing Back
   spends that spare entry, which fires the `popstate` event below — that's
   our signal — and we immediately park a fresh one so the next press works
   the same way. The page itself never actually goes anywhere, so Back can
   never accidentally exit the dashboard; it just walks up one level exactly
   like the on-screen corner button: out of a video to the list it came from,
   out of a week folder to the main menu, and from the main menu back to the
   screensaver. */
function goBackOneLevel(){
  if (currentView === 'player') { showMenu(); return; }
  if (currentView === 'menu') { handleMenuBack(); return; }
  // Already at the screensaver — there's nothing above it to go back to.
}

/* The remote's BACK key never reaches this page as a key press — the browser
   engine filters it out before web content ever sees it. The only route in is
   if the kiosk app answers BACK by telling the page to go back, which arrives
   here as a `popstate` event. So a spare history entry is parked underneath
   the page at all times; a BACK press spends it, and a fresh one is parked
   immediately so the next press works too.

   (An experiment with a deeper buffer and per-entry addresses did not help on
   the real TVs, so this is back to the simple version that at least handles
   the first press correctly.) */
function parkSpareHistoryEntry(){
  try { history.pushState({ ktvSpare: true }, ''); } catch (e) {}
}

(function initHistoryBackButton(){
  try {
    history.replaceState({ ktvBase: true }, '');
    parkSpareHistoryEntry();
    window.addEventListener('popstate', () => {
      restartIdleTimerIfActive();
      goBackOneLevel();
      parkSpareHistoryEntry(); // top the buffer back up so the next press works too
    });
  } catch (e) {
    // Very old/odd browsers without the history API: the on-screen back
    // button and the keys below still cover everything.
  }
})();

/* ============ START LOADING BEFORE THE BUTTON IS PRESSED ============
   Moving the remote's focus onto a tile is a reliable signal that it is about
   to be opened. Pictures are small (a couple of megabytes) and the browser
   keeps decoded images ready to draw, so fetching one the moment focus settles
   makes it appear instantly instead of after a visible pause.

   It waits for focus to SETTLE (three quarters of a second) so that scrolling
   along a row of tiles doesn't fire off a request for every tile passed over,
   and it only ever has one in flight.

   Videos are deliberately not prefetched: Google serves them with cache rules
   that mean a second request would download the file again rather than reuse
   it, so it would cost bandwidth without making anything faster. The win for
   videos came from the faststart fix and from showing the first frame as soon
   as it decodes.
   =================================================================== */
const PREFETCH_SETTLE_MS = 750;
let prefetchTimer = null;
let prefetchHolder = null;   // kept referenced so the browser doesn't discard it early

function prefetchFocusedTile(){
  clearTimeout(prefetchTimer);
  prefetchTimer = setTimeout(() => {
    try {
      const item = visibleItems[focusedIndex];
      if (!item || item.kind !== 'image' || !item.data || !item.data.fileId) return;
      const sources = imageSources(item.data.fileId);
      if (!sources.length) return;
      const img = new Image();
      img.decoding = 'async';
      img.src = sources[0].url;
      prefetchHolder = img;
    } catch (e) {}
  }, PREFETCH_SETTLE_MS);
}

/* ============ WARMING VIDEOS UP BEFORE ANYONE ASKS FOR ONE ============

   THE MEASUREMENT THAT MADE THIS THE RIGHT FIX
   --------------------------------------------
   What makes a video slow to start is NOT how big the file is. Every .mp4
   carries an index (the "moov atom") listing where every single frame lives,
   and the player can't show one pixel until it has the whole index. Measured
   across dozens of encodes, that index is 36 bytes per frame and depends on
   nothing else:

       15s clip   →   17,712 bytes
       10 min     →  653,160 bytes
       30 min     → 1,956,600 bytes

   Re-encoding a 30-minute video from 267MB down to 60MB does not change that
   number by even one byte. Same duration, same frame count, same index, same
   wait. So "make the files smaller" — the obvious fix, and the one I was
   about to recommend — would have saved bandwidth and bought roughly zero
   seconds at the start of a lesson.

   What the index size actually means, at the ~600 KB/s Google Drive gives:

       30-minute video → 1.9MB index → about 3.2 seconds before frame one

   That is the entire delay. And it is a fixed, predictable download that can
   perfectly well happen BEFORE the teacher presses anything.

   WHAT THIS DOES
   --------------
   While the menu is on screen, a hidden video element is pointed at each
   video in view, one at a time, with preload="metadata" — which fetches
   exactly the index and then stops. When a teacher presses OK, that warmed-up
   element is MOVED into the player rather than a new one being created, so
   the index it already holds comes with it and playback can begin at once.

   Moving the element is the whole trick: buffered data belongs to the element,
   not to the address, so a fresh <video> pointed at the same URL would start
   over from nothing.

   Warming pauses while a lesson is playing — the video on the wall should
   have the Wi-Fi to itself.
   ==================================================================== */
const WARM_MAX = 5;                 // hidden elements kept alive at once
const WARM_START_DELAY_MS = 400;    // let the menu paint before we touch the network
const WARM_TIMEOUT_MS = 30000;      // stop waiting on one file and move to the next

let warmPool = new Map();   // fileId -> a <video> holding that file's index
// Files that would not warm up. Without this, every press of an arrow key
// rebuilds the queue and re-attempts the same broken file, so one bad video
// would quietly hammer Google every time a teacher moved the cursor.
let warmFailed = new Set();
let warmQueue = [];
let warmBusy = false;
let warmPaused = false;
let warmInFlight = null;    // { fileId, el } currently downloading
let warmHolderEl = null;
let warmStartTimer = null;

function warmHolder(){
  if (!warmHolderEl) {
    warmHolderEl = document.createElement('div');
    warmHolderEl.id = 'videoWarmer';
    // Off-screen rather than display:none — a hidden element is allowed to
    // skip loading entirely in some browsers, which would defeat the point.
    warmHolderEl.style.cssText =
      'position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;';
    warmHolderEl.setAttribute('aria-hidden', 'true');
    document.body.appendChild(warmHolderEl);
  }
  return warmHolderEl;
}

// `expected` guards against a stale caller destroying a NEWER element that
// happens to share the same file id — see the note in warmNext's `done`.
function discardWarm(fileId, expected){
  const el = warmPool.get(fileId);
  if (expected && el && el !== expected) return;   // not ours any more: leave it alone
  const victim = el || expected;
  warmPool.delete(fileId);
  if (victim) {
    try { victim.removeAttribute('src'); victim.load(); } catch (e) {}
    if (victim.parentNode) victim.parentNode.removeChild(victim);
  }
}

function trimWarmPool(){
  // Map keeps insertion order, so the first key is the oldest.
  while (warmPool.size > WARM_MAX) {
    const oldest = warmPool.keys().next().value;
    if (oldest === undefined) break;
    discardWarm(oldest);
  }
}

// Stop everything in flight. Called the moment a lesson starts, so the video
// a class is actually watching is not competing with a background download.
function pauseWarming(){
  warmPaused = true;
  clearTimeout(warmStartTimer);
  warmQueue = [];
  if (warmInFlight) {
    // Close the attempt properly so its 30-second timer cannot come back
    // later and act on a world that has moved on.
    const inflight = warmInFlight;
    warmInFlight = null;
    if (inflight.settle) inflight.settle(false);
    else discardWarm(inflight.fileId, inflight.el);
  }
  warmBusy = false;
}

function resumeWarming(){
  warmPaused = false;
  scheduleWarming();
}

// Build the queue from what is on screen, focused tile first.
// A new list of videos is a fresh start: a file that failed last hour may
// simply have been a bad moment on the Wi-Fi.
function forgetWarmFailures(){ warmFailed.clear(); }

function scheduleWarming(){
  clearTimeout(warmStartTimer);
  if (warmPaused) return;
  warmStartTimer = setTimeout(() => {
    if (warmPaused || currentView !== 'menu') return;
    const wanted = [];
    for (let i = 0; i < visibleItems.length; i++) {
      const item = visibleItems[i];
      if (!item || item.kind !== 'video' || !item.data || !item.data.fileId) continue;
      wanted.push(item.data.fileId);
    }
    if (!wanted.length) return;
    // Whatever the cursor is sitting on is the one most likely to be pressed.
    const focused = visibleItems[focusedIndex];
    if (focused && focused.kind === 'video' && focused.data && focused.data.fileId) {
      const id = focused.data.fileId;
      const at = wanted.indexOf(id);
      if (at > 0) { wanted.splice(at, 1); wanted.unshift(id); }
    }
    warmQueue = wanted.filter(id => !warmPool.has(id) && !warmFailed.has(id));
    warmNext();
  }, WARM_START_DELAY_MS);
}

function warmNext(){
  if (warmBusy || warmPaused) return;
  const fileId = warmQueue.shift();
  if (!fileId) return;
  if (warmPool.has(fileId)) { warmNext(); return; }

  let sources;
  try { sources = orderedVideoSources(fileId); } catch (e) { return; }
  if (!sources || !sources.length) { warmNext(); return; }

  const el = document.createElement('video');
  el.preload = 'metadata';
  el.muted = true;
  el.setAttribute('playsinline', '');
  if (sources[0].crossOrigin) el.setAttribute('crossorigin', sources[0].crossOrigin);
  warmHolder().appendChild(el);

  warmBusy = true;
  warmInFlight = { fileId: fileId, el: el, settle: null };
  warmPool.set(fileId, el);
  trimWarmPool();

  // ABANDONING AN ATTEMPT HAS TO SETTLE IT, NOT JUST WALK AWAY.
  //
  // This 30-second timer can only be cancelled from inside `done`. If the
  // attempt was abandoned some other way — the teacher pressed the tile, or
  // a lesson started and warming paused — the timer stayed armed and fired
  // half a minute later against a world that had moved on: it freed
  // `warmBusy` while a *different* warm-up was genuinely in flight (so two
  // downloads then competed for the Wi-Fi), destroyed whatever element now
  // held this file id, and blacklisted the file — which is to say it
  // sabotaged precisely the tile the teacher was most likely to press.
  // `warmInFlight` now carries its own settle function so every exit closes
  // the attempt properly, and `discardWarm` is told which element is ours.
  let settled = false;
  // `quiet` means "close this attempt but do not start another" — used when
  // the player is taking this element, because a lesson is about to start and
  // the very next thing that happens is warming being paused anyway.
  const done = (keep, quiet) => {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    if (warmInFlight && warmInFlight.fileId === fileId) warmInFlight = null;
    warmBusy = false;
    if (!keep) { discardWarm(fileId, el); warmFailed.add(fileId); }
    // One at a time, always: two background downloads would halve the speed
    // of the one the teacher is most likely to want.
    if (!quiet && !warmPaused) warmNext();
  };
  const timer = setTimeout(() => done(false), WARM_TIMEOUT_MS);
  if (warmInFlight && warmInFlight.fileId === fileId) warmInFlight.settle = done;
  el.addEventListener('loadedmetadata', () => done(true), { once: true });
  el.addEventListener('error', () => done(false), { once: true });

  try { el.src = sources[0].url; el.load(); } catch (e) { done(false); }
}

// Hand the player a warmed-up element, if we have a usable one. Returns null
// when there is nothing ready, and the player creates a fresh element as
// before — so this can only ever make things faster, never break them.
function takeWarmVideo(fileId){
  const el = warmPool.get(fileId);
  if (!el) return null;
  warmPool.delete(fileId);
  // Handing this element to the player ends its warm-up. Settle it first, or
  // its timer fires half a minute later and tramples whatever has taken its
  // place — including a fresh warm-up of the very same file.
  if (warmInFlight && warmInFlight.fileId === fileId) {
    const inflight = warmInFlight;
    warmInFlight = null;
    if (inflight.settle) inflight.settle(true, true);   // close it, start nothing
    warmBusy = false;
  }
  // A half-downloaded index is still a head start, so a still-loading element
  // is worth taking; only a broken or address-less one is thrown away.
  if (el.error || !el.getAttribute('src')) {
    if (el.parentNode) el.parentNode.removeChild(el);
    return null;
  }
  if (el.parentNode) el.parentNode.removeChild(el);
  return el;
}

/* ==================== TVs THAT UPDATE THEMSELVES ====================
   Ten televisions on brackets in ten classrooms. Nobody should have to visit
   each one with a remote to clear a cache after every change — and kiosk
   browsers hold on to a cached page hard enough that server cache headers
   can't be relied on to dislodge it.

   So the page checks for itself. Every so often it re-downloads its own
   address with caching explicitly bypassed, looks for the build stamp near
   the top of the file, and if it differs from the copy that is running, it
   reloads.

   IT ONLY EVER RELOADS AT THE SCREENSAVER. A lesson is never interrupted:
   if a teacher is mid-video the update just waits for the next quiet moment.
   =================================================================== */
const UPDATE_CHECK_MINUTES = 20;

async function checkForNewVersion(){
  try {
    // The random parameter and no-store together are what get us past both
    // the browser cache and any cache in between.
    const response = await fetch(location.pathname + '?ktvcheck=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) return;
    const text = await response.text();
    const match = text.match(/KTV_BUILD\s*=\s*"([^"]+)"/);
    if (!match) return;                       // couldn't find the stamp: leave well alone
    if (match[1] === KTV_BUILD) return;       // already up to date
    if (currentView !== 'screensaver') return; // mid-lesson — try again next time
    console.log('[KidsTV] new version ' + match[1] + ' available, reloading');
    location.reload();
  } catch (e) {
    // Offline or the check failed — completely harmless, we just try later.
  }
}

setInterval(checkForNewVersion, UPDATE_CHECK_MINUTES * 60 * 1000);
// Also look shortly after start-up, so a TV switched on after a change picks
// it up straight away rather than up to twenty minutes later.
setTimeout(checkForNewVersion, 45 * 1000);

// AND look every time the TV falls back to the screensaver.
//
// This is the one that makes a change actually appear. The timer above can
// only reload at the screensaver, so if its twenty-minute tick happens to
// land while a class is watching a video, that TV stays on the old version
// for another twenty minutes — which is exactly what "I can't get the TVs to
// show the new version" feels like from the other end. Checking on the way
// back to the screensaver means a TV picks up a change within seconds of the
// lesson it was showing finishing.
//
// Throttled so that a teacher tapping in and out of the menu can't turn this
// into a request every second.
var SCREENSAVER_CHECK_MIN_GAP_MS = 90 * 1000;
var lastUpdateCheckAt = 0;   // var, not let: showScreensaver must never be able
                             // to throw, whatever order things load in
function checkForNewVersionAtScreensaver(){
  const now = Date.now();
  if (now - lastUpdateCheckAt < SCREENSAVER_CHECK_MIN_GAP_MS) return;
  lastUpdateCheckAt = now;
  checkForNewVersion();
}

/* ==================== THE SPEED SCREEN ====================
   Press UP twice, quickly, on the screensaver.

   This exists because the single most important number — how fast this
   television can actually pull video — cannot be measured from anywhere but
   this television. Google Drive's speed, the church Wi-Fi, the distance to
   the router and the wall the signal goes through all land in one figure, and
   that figure decides whether anything further is worth doing.

   It shows two things:
     • what real lessons took to start, measured as they played
     • a live test: fetch 2MB and time it

   Press any key to close. Nothing here changes any setting.
   ========================================================= */
const START_LOG_MAX = 6;
let startLog = [];

/* CHECK EVERY FILE, FROM THE TELEVISION ITSELF.
   A file that Mum has moved, renamed or un-shared looks perfectly fine in
   Drive and perfectly fine in the Sheet; the only place it fails is on a
   classroom wall, in front of children, on a Sunday. This asks the TV to
   fetch the first two kilobytes of every single file in its list — enough to
   prove the address answers, small enough that fifty-odd of them cost less
   than one lesson video — and names anything that doesn't answer.
   It runs where the problem would happen, on the same Wi-Fi, with the same
   key, which is the whole point of it living here rather than in a script. */
let fileCheckReport = '';
let fileCheckRunning = false;
let fileCheckAbort = null;

function sourcesForRow(b){
  const t = String(b.type || '');
  if (t.indexOf('image/') === 0) return imageSources(b.fileId);
  if (t.indexOf('audio/') === 0) return audioSources(b.fileId);
  return orderedVideoSources(b.fileId);
}

async function checkEveryFile(){
  if (fileCheckRunning) return;
  const rows = buttons.concat(musicTracks).filter(b => b && b.fileId);
  if (!rows.length) { fileCheckReport = 'FILE CHECK\n  nothing in the list to check'; return; }
  fileCheckRunning = true;
  fileCheckAbort = new AbortController();
  const bad = [];
  let done = 0;

  const paint = () => {
    fileCheckReport = 'FILE CHECK  ' + done + ' of ' + rows.length + ' checked' +
      (bad.length ? '  ·  ' + bad.length + ' PROBLEM' + (bad.length > 1 ? 'S' : '') : '') +
      (done < rows.length ? '  (working…)' : '') +
      (bad.length ? '\n' + bad.map(x => '  ✗ ' + x).join('\n') : (done === rows.length ? '\n  every file answered — nothing to fix' : ''));
    renderSpeedPanel();
  };
  paint();

  for (const row of rows) {
    if (!fileCheckRunning) break;
    let ok = false, why = 'no answer';
    const sources = sourcesForRow(row);
    for (const src of sources) {
      try {
        const res = await fetch(src.url, {
          headers: { Range: 'bytes=0-2047' }, cache: 'no-store', signal: fileCheckAbort.signal
        });
        if (res.ok || res.status === 206) { ok = true; break; }
        why = 'server said ' + res.status;
      } catch (e) {
        if (e && e.name === 'AbortError') { fileCheckRunning = false; return; }
        why = 'could not be reached';
      }
    }
    if (!ok) bad.push(String(row.label || row.fileId).slice(0, 40) + '  (' + why + ')');
    done++;
    if (done % 3 === 0 || done === rows.length) paint();
  }
  fileCheckRunning = false;
  paint();
}

function stopFileCheck(){
  fileCheckRunning = false;
  if (fileCheckAbort) { try { fileCheckAbort.abort(); } catch (e) {} fileCheckAbort = null; }
}

function noteStartTime(label, ms, wasWarm){
  startLog.unshift({ label: label || 'video', ms: ms, warm: !!wasWarm });
  if (startLog.length > START_LOG_MAX) startLog.length = START_LOG_MAX;
}

function speedPanel(){
  let el = document.getElementById('speedPanel');
  if (!el) {
    el = document.createElement('div');
    el.id = 'speedPanel';
    el.style.cssText =
      'position:fixed;inset:0;z-index:120;background:#060a14;color:#e8eefc;' +
      'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.15rem;line-height:1.7;' +
      'padding:6vh 7vw;overflow:auto;white-space:pre-wrap;';
    document.body.appendChild(el);
  }
  return el;
}

function closeSpeedPanel(){
  stopFileCheck();          // don't leave fifty requests running behind a closed screen
  fileCheckReport = '';
  const el = document.getElementById('speedPanel');
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

function describeStarts(){
  if (!startLog.length) return '  (no lessons played yet on this TV since it last restarted)';
  return startLog.map(r =>
    '  ' + (r.ms / 1000).toFixed(1) + 's   ' + (r.warm ? '[ready ahead]' : '[from cold] ') +
    '  ' + String(r.label).slice(0, 34)
  ).join('\n');
}

// The panel's last measured figures, kept outside the function that produced
// them so the file check can repaint the screen as it works without having to
// re-run the speed test.
let speedLineText = '  measuring…';
let speedVerdictText = '';

function renderSpeedPanel(){
  const el = document.getElementById('speedPanel');
  if (!el) return;
  el.textContent =
    'SPEED CHECK — First Kids TV\n' +
    '===========================\n\n' +
    'Build     ' + KTV_BUILD + '\n' +
    'Room      ' + (ROOM || '(not set — this TV shows both rooms)') + '\n' +
    'Videos    ' + buttons.length + ' in the list' +
      (musicTracks.length ? '  ·  ' + musicTracks.length + ' songs' : '  ·  no songs yet') + '\n\n' +
    'HOW FAST THIS TV PULLS VIDEO\n' + speedLineText + '\n\n' +
    speedVerdictText + '\n\n' +
    'RECENT LESSONS, TIME TO FIRST PICTURE\n' + describeStarts() + '\n\n' +
    (fileCheckReport || 'Press OK to check every file in the list.') + '\n\n' +
    'Press any key to close.';
}

async function measureSpeed(){
  speedPanel();
  const first = buttons.find(b => b.fileId && mediaKind(b) === 'video');
  const render = (speedLine, verdict) => {
    speedLineText = speedLine; speedVerdictText = verdict; renderSpeedPanel();
  };

  render('  measuring…', '');
  if (!first) { render('  no video available to test with', ''); return; }

  try {
    const src = orderedVideoSources(first.fileId)[0];
    // Never let the measurement itself hang the screen. If a server answers
    // with a length it then fails to deliver, the request would otherwise sit
    // there forever and the panel would read "measuring…" until someone
    // pressed a key.
    const stop = new AbortController();
    const giveUp = setTimeout(() => stop.abort(), 20000);
    const t0 = performance.now();
    let bytes = 0;
    try {
      const res = await fetch(src.url, {
        headers: { Range: 'bytes=0-2097151' }, cache: 'no-store', signal: stop.signal
      });
      if (res.body && res.body.getReader) {
        // Read incrementally so a short answer still counts what did arrive.
        const reader = res.body.getReader();
        for (;;) {
          const step = await reader.read();
          if (step.done) break;
          bytes += step.value ? step.value.length : 0;
          if (bytes >= 2097152) { try { reader.cancel(); } catch (e2) {} break; }
        }
      } else {
        bytes = (await res.arrayBuffer()).byteLength;
      }
    } catch (abortErr) {
      // Aborted or failed partway: whatever arrived is still a real sample.
    }
    clearTimeout(giveUp);
    const secs = (performance.now() - t0) / 1000;
    if (bytes < 32768) { render('  only ' + bytes + ' bytes arrived in ' + secs.toFixed(1) + 's',
      'VERDICT: this TV can barely reach the videos at all. Check its Wi-Fi.'); return; }
    const kbs = Math.round((bytes / 1024) / Math.max(0.001, secs));

    // A 30-minute video carries a ~1.9MB index, and nothing can start before
    // that index has arrived. This turns the measured speed into the number
    // that actually matters to a teacher.
    const ttff = 1956600 / (kbs * 1024);
    const verdict =
      kbs >= 1500 ? 'VERDICT: plenty fast. A 30-minute video should start in about ' + ttff.toFixed(1) + 's.'
    : kbs >= 650  ? 'VERDICT: adequate. A 30-minute video should start in about ' + ttff.toFixed(1) + 's.'
    : kbs >= 250  ? 'VERDICT: slow. A 30-minute video needs about ' + ttff.toFixed(1) + 's from cold.\n' +
                    '         Warming on the menu hides most of this. Moving the videos off\n' +
                    '         Google Drive would fix it properly.'
    :               'VERDICT: very slow — something is wrong with this TV\'s Wi-Fi.\n' +
                    '         Check signal strength before changing anything else.';

    render('  ' + (bytes / 1048576).toFixed(2) + 'MB in ' + secs.toFixed(1) + 's  =  ' +
           kbs + ' KB/s  (' + (kbs * 8 / 1024).toFixed(1) + ' Mbps)', verdict);
  } catch (e) {
    render('  the test could not run: ' + (e && e.message ? e.message : 'unknown error'),
           'If every video also fails, this TV is offline.');
  }
}

/* ==================== LOOK-AND-FEEL THEMES ====================
   Five complete colour schemes live in the stylesheet at the top of this file.
   Switching is deliberately hidden so it can't be triggered by accident during
   a lesson: press LEFT twice, quickly, while the screensaver is showing.
   The choice is saved per TV, so the Preschool room can look different from
   the Elementary room if you want.
   ============================================================= */
const THEMES = [
  { id: 'classic',      name: 'Classic Navy' },
  { id: 'confetti',     name: 'Confetti'     },   // squiggles, sparkles and dots
  { id: 'rainbow',      name: 'Rainbow'      },   // rainbows and a smiling sun
  { id: 'starrynight',  name: 'Starry Night' },   // stars and a crescent moon
  { id: 'garden',       name: 'Garden'       },   // flowers and leaves
  { id: 'deepsea',      name: 'Deep Sea'     },   // waves and bubbles
  { id: 'sunshine',     name: 'Sunshine'     },
  { id: 'bubblegum',    name: 'Bubblegum'    },
  { id: 'jungle',       name: 'Jungle'       },
  { id: 'cosmos',       name: 'Cosmos'       },   // planets, a rocket, stars
  { id: 'campfire',     name: 'Campfire'     },   // flames, marshmallows, sparks
  { id: 'snowday',      name: 'Snow Day'     },   // snowflakes and mittens
  { id: 'lemonade',     name: 'Lemonade'     },   // citrus slices and mint
  { id: 'chalkboard',   name: 'Chalkboard'   },   // white chalk doodles on green
  { id: 'highcontrast', name: 'Big & Bold'   },
];

function currentThemeId(){
  try { return localStorage.getItem('ktv_theme') || 'classic'; } catch (e) { return 'classic'; }
}

function applyTheme(id, announce){
  const theme = THEMES.find(t => t.id === id) || THEMES[0];
  document.documentElement.setAttribute('data-theme', theme.id);
  try { localStorage.setItem('ktv_theme', theme.id); } catch (e) {}
  if (announce) showThemeToast(theme.name);
}

// A brief label so whoever is changing the theme can see which one they landed
// on. Disappears on its own; nothing to dismiss.
let themeToastTimer = null;
function showThemeToast(name){
  let el = document.getElementById('themeToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'themeToast';
    el.style.cssText = 'position:fixed;left:50%;bottom:8%;transform:translateX(-50%);z-index:60;' +
      'padding:14px 30px;border-radius:999px;background:rgba(0,0,0,0.78);border:2px solid var(--accent);' +
      'color:#fff;font-size:1.4rem;font-weight:700;letter-spacing:.4px;pointer-events:none;' +
      'transition:opacity .3s ease;box-shadow:0 10px 40px rgba(0,0,0,.6)';
    document.body.appendChild(el);
  }
  el.textContent = 'Theme: ' + name;
  el.style.opacity = '1';
  clearTimeout(themeToastTimer);
  themeToastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

/* ==================== THE THEME PICKER ====================
   This replaced a cycle-through-them-one-at-a-time gesture, which asked
   whoever was choosing to hold fifteen looks in their head and press LEFT
   until the right one came round again. A picker shows them all at once.

   Each card carries `data-theme` itself, and every theme is defined as a
   plain attribute selector rather than one pinned to the page root — so a
   card genuinely paints itself in the theme it is offering, patterns and all.
   Nothing here draws a picture OF a theme; each swatch IS one.

   Moving the cursor also applies that theme to the page behind the cards, so
   it can be judged at full size. Leaving without choosing puts back whatever
   was there before.
   ========================================================= */
const themePickerEl = document.getElementById('themePicker');
const tpGrid = document.getElementById('tpGrid');
let tpOpen = false;
let tpIndex = 0;
let tpThemeBefore = null;

function tpColumns(){
  // Enough columns that every theme is on screen at once without the cards
  // getting too small to read from the back of a classroom.
  const w = window.innerWidth || 1280;
  return w >= 1600 ? 5 : w >= 1100 ? 4 : w >= 760 ? 3 : 2;
}

function openThemePicker(){
  if (tpOpen) return;
  tpOpen = true;
  tpThemeBefore = currentThemeId();
  tpIndex = Math.max(0, THEMES.findIndex(t => t.id === tpThemeBefore));

  tpGrid.style.setProperty('--tp-cols', tpColumns());
  tpGrid.innerHTML = '';
  THEMES.forEach((theme, i) => {
    const card = document.createElement('div');
    card.className = 'tp-card';
    card.setAttribute('data-theme', theme.id);   // this is what makes it a real swatch
    card.innerHTML =
      (theme.id === tpThemeBefore ? '<span class="tp-current">Now</span>' : '') +
      '<span class="tp-name">' + escapeHtml(theme.name) + '</span>' +
      '<span class="tp-tiles">' +
        '<span class="tp-tile lead"></span><span class="tp-tile"></span>' +
        '<span class="tp-tile"></span><span class="tp-tile"></span>' +
      '</span>';
    card.addEventListener('click', () => { tpIndex = i; tpApplyFocus(); confirmThemeChoice(); });
    tpGrid.appendChild(card);
  });

  themePickerEl.hidden = false;
  tpApplyFocus();
}

function tpApplyFocus(){
  const cards = tpGrid.querySelectorAll('.tp-card');
  cards.forEach((c, i) => c.classList.toggle('focused', i === tpIndex));
  const el = cards[tpIndex];
  if (el) el.scrollIntoView({ block: 'nearest' });
  // Preview at full size, without saving it — leaving puts the old one back.
  const theme = THEMES[tpIndex];
  if (theme) document.documentElement.setAttribute('data-theme', theme.id);
}

function tpMove(dx, dy){
  const cols = tpColumns();
  let i = tpIndex;
  if (dx) i += dx;
  if (dy) i += dy * cols;
  if (i < 0 || i >= THEMES.length) return;   // stop at the edges rather than wrapping
  tpIndex = i;
  tpApplyFocus();
}

function confirmThemeChoice(){
  const theme = THEMES[tpIndex] || THEMES[0];
  closeThemePicker(true);
  applyTheme(theme.id, true);
}

function closeThemePicker(keep){
  if (!tpOpen) return;
  tpOpen = false;
  themePickerEl.hidden = true;
  if (!keep && tpThemeBefore) document.documentElement.setAttribute('data-theme', tpThemeBefore);
  tpThemeBefore = null;
}

applyTheme(currentThemeId(), false); // restore this TV's saved look immediately

// Two LEFT presses within this window on the screensaver = change theme.
const THEME_GESTURE_MS = 1500;
let lastLeftPressAt = 0;
let lastUpPressAt = 0;

/* ==================== PLAYER CHROME (auto-hiding) ====================
   The back arrow and the one-line hint fade away a few seconds after the last
   remote press, and reappear instantly on the next one. While a video is
   paused they stay visible, because a frozen picture with no controls reads
   as "broken" rather than "paused".
   ==================================================================== */
/* The player has no on-screen controls left to show or hide — the back arrow
   was removed and so was the hint line. What survives here is the one part
   still needed: creating the pause badge the first time a video opens. The
   fade timer and its class went with the controls they used to move. */
function ensurePlayerChrome(){
  if (!document.getElementById('pauseBadge')) {
    const badge = document.createElement('div');
    badge.id = 'pauseBadge';
    badge.innerHTML =
      '<div class="bars">' +
        '<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          '<rect x="15" y="10" width="11" height="40" rx="2.5" fill="#ffffff"></rect>' +
          '<rect x="34" y="10" width="11" height="40" rx="2.5" fill="#ffffff"></rect>' +
        '</svg>' +
      '</div>';
    playerEl.appendChild(badge);
  }
}

function showPlayerChrome(){
  ensurePlayerChrome();
}

// Only videos can pause. Pictures ignore OK entirely — pressing it should
// never look like it "did nothing wrong but nothing happened", so the chrome
// reappears as feedback.
function togglePlayPause(){
  const vid = document.getElementById('playerVideo');
  showPlayerChrome();
  if (!vid) return false;
  if (vid.paused) { vid.play().catch(() => {}); playerEl.classList.remove('is-paused'); }
  else { vid.pause(); playerEl.classList.add('is-paused'); }
  return true;
}

document.addEventListener('keydown', (e) => {
  restartIdleTimerIfActive();

  // Back-ish keys, across every remote/browser spelling we've seen. Android's
  // own back key is code 4; some TV browsers send Escape or a named GoBack.
  const isBackKey = ['Escape','Backspace','GoBack','BrowserBack'].includes(e.key) || e.keyCode === 4;

  // The picker owns the remote entirely while it is open — it sits over the
  // screensaver, so without this the arrow keys would also be driving the
  // screensaver's own gestures underneath it.
  if (tpOpen) {
    e.preventDefault();
    if (isBackKey) { closeThemePicker(false); return; }
    if (e.key === 'ArrowLeft')  { tpMove(-1, 0); return; }
    if (e.key === 'ArrowRight') { tpMove(1, 0);  return; }
    if (e.key === 'ArrowUp')    { tpMove(0, -1); return; }
    if (e.key === 'ArrowDown')  { tpMove(0, 1);  return; }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { confirmThemeChoice(); return; }
    return;   // anything else does nothing rather than falling through
  }

  if (currentView === 'screensaver') {
    if (isBackKey) return; // Back at the screensaver does nothing — already home
    // LEFT is reserved here as the hidden theme switch: two presses within a
    // second and a half cycle the colour scheme. A single LEFT does nothing,
    // which is why it can't be stumbled into — every OTHER key still wakes
    // the menu exactly as before.
    if (document.getElementById('speedPanel')) {
      e.preventDefault();
      // OK starts the whole-library check; every other key closes the screen.
      if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') && !fileCheckRunning) {
        checkEveryFile();
        return;
      }
      closeSpeedPanel();
      return;
    }
    if (e.key === 'ArrowLeft') {
      const now = Date.now();
      if (now - lastLeftPressAt < THEME_GESTURE_MS) { openThemePicker(); lastLeftPressAt = 0; }
      else { lastLeftPressAt = now; }
      e.preventDefault();
      return;
    }
    // UP twice, quickly, opens the speed check — same idea as the theme
    // switch, and just as impossible to hit by accident.
    if (e.key === 'ArrowUp') {
      const now = Date.now();
      if (now - lastUpPressAt < THEME_GESTURE_MS) { lastUpPressAt = 0; measureSpeed(); }
      else { lastUpPressAt = now; }
      e.preventDefault();
      return;
    }
    lastUpPressAt = 0;
    lastLeftPressAt = 0;
    e.preventDefault();
    showMenu();
    return;
  }

  if (currentView === 'player') {
    // AN ERROR SCREEN MUST NEVER BE A TRAP. The player's back arrow is hidden
    // by request, and Android TV swallows the remote's own Back key before
    // any web page can see it — so on a failure screen there was nothing at
    // all a teacher could press, and the room sat looking at it until the
    // 45-minute idle timer. Any key now takes them back to the list.
    const errPanel = document.getElementById('playerError');
    if (errPanel && errPanel.hidden === false) { e.preventDefault(); goBackOneLevel(); return; }
    showPlayerChrome(); // any remote press brings the controls back for a few seconds
    const vid = document.getElementById('playerVideo');
    // Left/right nudge through the video — handy for replaying a line of a
    // memory verse without starting the whole thing over.
    if (e.key === 'ArrowLeft' && vid) { vid.currentTime = Math.max(0, vid.currentTime - 10); e.preventDefault(); return; }
    if (e.key === 'ArrowRight' && vid) { vid.currentTime = vid.currentTime + 10; e.preventDefault(); return; }
    if ((e.key === 'MediaPlayPause' || e.key === 'MediaPause' || e.key === 'MediaPlay') && vid) {
      if (vid.paused) vid.play().catch(()=>{}); else vid.pause();
      e.preventDefault(); return;
    }
    // OK / Select is the pause button. This is the one key Android TV
    // guarantees will reach the page (BACK is filtered out by the browser
    // itself before web content ever sees it), so it carries the action a
    // teacher needs most while a video is on the wall.
    if (['Enter',' '].includes(e.key)) { togglePlayPause(); e.preventDefault(); return; }
    // Back-style keys leave the video. On a TV remote this only arrives if
    // the kiosk app forwards it (see the popstate handler below) — the
    // on-screen arrow is the guaranteed path.
    if (isBackKey) { e.preventDefault(); showMenu(); return; }
    return;
  }

  if (currentView === 'menu') {
    if (isBackKey) { handleMenuBack(); e.preventDefault(); return; }
    const cols = currentCols;
    const count = visibleItems.length; // slots 0..count-1 are tiles, slot `count` is the back button
    switch (e.key) {
      case 'ArrowRight':
        if (focusedIndex < count - 1) focusedIndex++;
        applyFocusVisual(); e.preventDefault(); break;
      case 'ArrowLeft':
        if (focusedIndex < count && focusedIndex > 0) focusedIndex--;
        applyFocusVisual(); e.preventDefault(); break;
      case 'ArrowDown':
        if (focusedIndex >= count) { /* already on the back button — nowhere further down */ }
        else if (focusedIndex + cols >= count) focusedIndex = count; // last row -> the back button
        else focusedIndex += cols;
        applyFocusVisual(); e.preventDefault(); break;
      case 'ArrowUp':
        if (focusedIndex >= count) focusedIndex = Math.max(0, count - 1); // back button -> last tile
        else focusedIndex = Math.max(0, focusedIndex - cols);
        applyFocusVisual(); e.preventDefault(); break;
      case 'Enter': case ' ':
        if (focusedIndex >= count) { handleMenuBack(); } else { activateItem(focusedIndex); }
        e.preventDefault(); break;
    }
  }
});

// Touch / click support (tapping the TV directly, or a mouse while testing on a Mac)
screensaverEl.addEventListener('click', () => { if (currentView === 'screensaver') showMenu(); });
menuCloseBtn.addEventListener('click', handleMenuBack);
playerBackBtn.addEventListener('click', showMenu);

/* ---------------------- Idle auto-return ---------------------- */
function startMenuIdleTimer(){
  clearIdleTimer();
  const mins = Number(CONFIG.MENU_IDLE_MINUTES) || 0;
  if (mins > 0) idleTimer = setTimeout(showScreensaver, mins * 60 * 1000);
}

function startIdleTimer(){
  clearIdleTimer();
  if (CONFIG.IDLE_RETURN_MINUTES > 0) {
    idleTimer = setTimeout(showScreensaver, CONFIG.IDLE_RETURN_MINUTES * 60 * 1000);
  }
}
function clearIdleTimer(){ if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }
function restartIdleTimerIfActive(){ if (idleTimer) startIdleTimer(); }

/* ---------------------- Boot ----------------------
   Draw the list from the copy saved on this TV first, then refresh from the
   Google Sheet in the background. Fetching the Sheet takes a second or two on
   a cheap TV stick; without this, a teacher who walks up and presses the
   remote during those first seconds gets "Loading the lesson list…" and a
   blank grid. With it, the buttons are already there — and if the Wi-Fi
   happens to be down that morning, they're there anyway. */
(function bootFromCache(){
  try {
    const cached = JSON.parse(localStorage.getItem('ktv_last_good_config') || 'null');
    if (cached && cached.length) {
      applyRows(cached);
      loadThumbnailsUpFront(buttons);
      renderButtons();
      updateMenuTitle();
      updateBackButtonLabel();
    }
  } catch (e) {}
})();

loadConfigFromSheet();
setInterval(loadConfigFromSheet, Math.max(1, CONFIG.REFRESH_MINUTES) * 60 * 1000);
</script>
