<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kids Ministry TV</title>

<!--
  =====================================================================
  KIDS MINISTRY TV DASHBOARD
  =====================================================================
  Everything you might want to change lives in the CONFIG block below,
  in the <script> near the bottom of this file. You should not need to
  touch anything else. Search for "EDIT ME" to jump to the settings.
  =====================================================================
-->

<!-- The build, where it can be read from OUTSIDE the page. KTV_BUILD below
     lives inside a script, so anyone checking which version a TV is actually
     serving had to run the page to find out. This makes it a plain fetch. -->
<meta name="ktv-build" content="2026-09-06i">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Opening a connection to Google costs about a third of a second on a cheap
     TV stick (DNS + handshake). Doing it here, while the page is still
     drawing, means that cost is already paid by the time a teacher actually
     presses a video — so the first press feels instant instead of laggy.
     drive.google.com serves the button thumbnails; googleapis.com serves the
     videos themselves once an API key is configured. -->
<link rel="preconnect" href="https://drive.google.com" crossorigin>
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://docs.google.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

     Every colour on the screen comes from the handful of variables below, so a
     whole new look is just a different set of values — nothing else in the page
     changes. The theme is switched by pressing LEFT twice on the screensaver
     (deliberately obscure, so a teacher can't wander into it) and is remembered
     on that TV afterwards. Each TV keeps its own choice.
     ---------------------------------------------------------------- */

    --bg: #0b1120;
    --bg-panel: #141d33;
    --bg-panel-2: #1b2740;
    --accent: #f6ad37;
    --accent-ink: #3a2405;
    --text: #f8fafc;
    --muted: #93a1bd;
    --border: #2a3757;
    --danger: #ef4b5f;
    --focus-ring: 0 0 0 6px rgba(246,173,55,0.35), 0 0 0 3px var(--accent);
    --radius: 28px;
  }

    --tile-edge: rgba(255,138,61,0.18);

    --tile-edge: rgba(255,95,162,0.22);

  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .display-font{ font-family: 'Fredoka', 'Inter', sans-serif; }

  /* ---------- SCREENSAVER LAYER ---------- */
  #screensaver{
    position: fixed; inset: 0;
    background: #000;
    display:flex; align-items:center; justify-content:center;
    z-index: 5;
  }
  /* PARKED = completely out of the render, not merely covered up.
     The menu is opaque and covers the whole screen, so while it is open the
     logo behind it is invisible — but a browser does not know that. A video
     back there goes on decoding thirty frames a second, and an animation goes
     on animating, all of it thrown away, all of it taken from the very work
     the menu is trying to do while a teacher moves the cursor. display:none
     stops both dead. It is the same reason the tiles stopped stuttering: on
     this hardware, the fix is nearly always to stop doing invisible work. */
  #screensaver.parked{ display:none; }
  #screensaver video, #screensaver img{
    width:100%; height:100%; object-fit: cover;
  }
  /* BURN-IN. A logo held perfectly still on the same pixels for four hours
     every Sunday is how a panel gets a permanent ghost of it — the real risk
     with a still picture that a moving video never had. So the picture drifts
     and breathes, very slowly, on a two-minute cycle: too slow for anyone in
     the room to notice it moving, far too much movement for any one pixel to
     hold the same colour. It is a transform, so the graphics chip does it for
     nothing — unlike decoding video, it costs no measurable CPU. */
  @keyframes ktv-drift{
    0%   { transform: scale(1.06) translate(0, 0); }
    25%  { transform: scale(1.06) translate(-1.1%, 0.7%); }
    50%  { transform: scale(1.06) translate(0.9%, -0.9%); }
    75%  { transform: scale(1.06) translate(1.1%, 0.8%); }
    100% { transform: scale(1.06) translate(0, 0); }
  }
  #screensaverImage{
    animation: ktv-drift 120s ease-in-out infinite;
  }
  /* Anyone who has asked their system not to animate things gets a still
     picture; the slight burn-in risk is theirs to accept. */
  @media (prefers-reduced-motion: reduce){
    #screensaverImage{ animation: none; }
  }
  #screensaverFallback{
    display:none;
    flex-direction:column; align-items:center; gap:18px;
    text-align:center; padding:40px;
  }
  #screensaverFallback .glyph{ font-size: 5rem; }
  #screensaverFallback h1{ font-size: clamp(2rem, 5vw, 3.5rem); margin:0; letter-spacing:1px; }
  #screensaverFallback p{ color:var(--muted); font-size:1.2rem; max-width:640px; margin:0; }

  /* ---------- THEME PICKER ----------
     Every card carries its own data-theme, so it paints itself in the colours
     and pattern of the theme it is offering — the swatch IS the theme, not a
     drawing of it. Moving the cursor also repaints the page behind the cards,
     so a theme can be judged at full size before it is chosen. */
  #themePicker{
    position:fixed; inset:0; z-index:70;
    background: var(--bg);
    background-image: linear-gradient(var(--pattern-veil, transparent), var(--pattern-veil, transparent)),
                      var(--menu-pattern, none),
                      radial-gradient(ellipse at top, var(--bg-panel-2), var(--bg) 70%);
    background-repeat: no-repeat, repeat, no-repeat;
    display:flex; flex-direction:column;
    /* Same safe margins the menu uses — TVs crop the outer few percent of the
       picture, and a card sliced in half is not a swatch. */
    --tv-safe-x: 5;
    --tv-safe-y: 7;
    padding: max(48px, calc(var(--tv-safe-y) * 1vh))
             max(48px, calc(var(--tv-safe-x) * 1vw))
             max(24px, calc(var(--tv-safe-y) * 0.7vh));
    gap:18px; overflow:hidden;
  }
  #themePicker.open{ display:flex; }
  .tp-head h2{ margin:0; font-size: clamp(1.6rem, 3vw, 2.4rem); color:var(--text); letter-spacing:.5px; }
  .tp-head p{ margin:6px 0 0; color:var(--muted); font-size: clamp(.95rem, 1.4vw, 1.15rem); }
  .tp-grid{
    flex:1 1 auto; min-height:0; display:grid;
    grid-template-columns: repeat(var(--tp-cols, 5), 1fr);
    /* Equal rows that share the height that actually exists, so the cards
       fill the screen instead of huddling at the top of it — on a TV seen
       from across a room, a bigger swatch is a more useful swatch. */
    grid-auto-rows: minmax(0, 1fr);
    gap:16px; overflow:hidden;
  }
  .tp-card{
    position:relative; border-radius:16px; overflow:hidden; cursor:pointer;
    border:3px solid var(--border);
    background: var(--bg);
    /* The veil is laid on TWICE here. At full size a pattern is texture; on a
       card the size of a playing card it is clutter competing with the theme's
       name. Doubling the wash keeps the motif recognisable and the name
       readable, without either being redrawn per theme. */
    background-image: linear-gradient(var(--pattern-veil, transparent), var(--pattern-veil, transparent)),
                      linear-gradient(var(--pattern-veil, transparent), var(--pattern-veil, transparent)),
                      var(--menu-pattern, none),
                      radial-gradient(ellipse at top, var(--bg-panel-2), var(--bg) 70%);
    background-repeat: no-repeat, no-repeat, repeat, no-repeat;
    background-size: auto, auto, 118px 118px, auto;
    display:flex; flex-direction:column; justify-content:space-between; gap:10px; padding:14px;
    transition: transform .12s ease;
  }
  /* The selection ring is deliberately NOT the card's own theme colour.
     Each card paints itself in the theme it offers, so a theme-coloured ring
     would be a different colour on every card — and on the quieter ones it
     would disappear into the card entirely. One fixed high-contrast ring,
     white against a dark core, reads instantly on every card from the back of
     a classroom, which is the only job it has. */
  .tp-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit;
    box-shadow: 0 0 0 4px #ffffff, 0 0 0 8px rgba(0,0,0,.72), 0 12px 30px rgba(0,0,0,.45);
    opacity:0; transition:opacity .12s ease; pointer-events:none;
  }
  .tp-card.focused{ transform: scale(1.04); }
  .tp-card.focused::before{ opacity:1; }
  .tp-name{
    font-family:'Fredoka', sans-serif; font-weight:600;
    font-size: clamp(1rem, 1.6vw, 1.4rem); color:var(--text); line-height:1.1;
    flex:none;
  }
  .tp-tiles{ display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:8px; flex:1 1 auto; min-height:0; }
  .tp-tile{
    min-height:0; border-radius:12px;
    background: linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
    border:2px solid var(--border);
  }
  .tp-tile.lead{ border-color: var(--accent); background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel)); }
  .tp-current{
    position:absolute; top:10px; right:10px;
    font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
    background: var(--accent); color: var(--accent-ink);
    padding:3px 7px; border-radius:999px;
  }

  /* ---------- MENU LAYER ---------- */
  #menu{
    position: fixed; inset:0;
    background-color: var(--bg);
    /* Three layers, top to bottom: a translucent wash of the theme's own
       background colour, then the decorative pattern, then the base gradient.
       The wash is what stops a busy pattern from competing with the tiles —
       the decoration reads as texture rather than as clutter, and the titles
       stay easy to read from across a room. Themes with no pattern set the
       wash to transparent, so nothing changes for them. */
    background-image: linear-gradient(var(--pattern-veil, transparent), var(--pattern-veil, transparent)),
                      var(--menu-pattern, none),
                      radial-gradient(ellipse at top, var(--bg-panel-2), var(--bg) 70%);
    background-repeat: no-repeat, repeat, no-repeat;
    background-size: cover, auto, cover;
    z-index: 10;
    display:none;
    flex-direction:column;
    /* TV OVERSCAN.
       Televisions crop the outer edge of the picture — typically 3-5% on each
       side — which is why the tiles look fine on a computer monitor and cut
       off on the actual TVs. These paddings are a percentage of the screen, so
       they scale into a real "safe area" on a 55" panel while staying modest
       in a laptop window. Raise --tv-safe if any TV still clips. */
    /* Vertical is given more room than horizontal on purpose: the title sits
       right at the top edge, and a 5% crop on a 1080p panel eats 54px — which
       is exactly where the heading started before. */
    /* The top keeps a real margin — the heading sits there and TVs crop the
       outer edge. The BOTTOM is deliberately much tighter, because nothing
       but tiles lives down there and every pixel given back makes the
       thumbnails bigger. Raise --tv-safe-bottom if any TV clips the last row. */
    --tv-safe-x: 5;
    --tv-safe-y: 7;
    --tv-safe-bottom: 2;
    padding: max(56px, calc(var(--tv-safe-y) * 1vh))
             max(56px, calc(var(--tv-safe-x) * 1vw))
             max(16px, calc(var(--tv-safe-bottom) * 1vh));
  }
  #menu.open{ display:flex; }

  .menu-header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 34px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .menu-header h1{
    margin:0; font-size: clamp(1.8rem, 3.4vw, 2.6rem);
    letter-spacing: 0.5px;
  }
  .menu-header .status{ line-height:1; }
  .menu-header .status .dot{
    display:inline-block; width:12px; height:12px; border-radius:50%;
    background: #4ade80;
  }
  .menu-header .status.stale .dot{ background: var(--danger); }

  #buttonGrid{
    display:grid;
    grid-template-columns: repeat(var(--cols, 3), 1fr);
    /* Each row reserves at least a full button's height (matching .btn's
       min-height below) and grows for taller content — never shrinks
       smaller than a button, which is what was letting rows visually
       overlap when the window was shorter than a TV screen (e.g. testing
       in a normal desktop browser instead of full-screen on the TV). */
    /* Sized from the screen's own height rather than a fixed pixel number, so
       tiles are generous on a 55" TV without overflowing a laptop window while
       you're testing. The cap keeps a very tall screen from making three
       enormous tiles; the floor keeps a short one usable. Roughly 16:9 at TV
       size, which is what makes a video thumbnail look like a video thumbnail
       instead of a cropped strip. */
    /* Row height and column count are measured and set by fitGrid() below,
       from the height this grid REALLY has on the screen it is running on.
       The clamp here is only the value used for the split second before that
       runs, and a fallback if the script ever fails. Guessing the height from
       vh units is what let a second row hang off the bottom edge of a TV
       while looking perfect in a desktop browser. */
    grid-auto-rows: var(--row-h, clamp(160px, 23vh, 280px));
    align-content: start;
    gap: 28px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    /* Top/left/right padding needs to be bigger than it looks like it
       "should" be. Setting overflow-y here quietly forces the browser to
       clip overflow-x too (a real CSS rule: once one axis isn't `visible`,
       the other can't stay `visible` either) — and a focused button's glow
       (--focus-ring, ~6px) plus its scale(1.045) zoom (~5px) bleed past the
       button's own edge. With only 6px of padding, the very first row/column
       had its focus glow sliced off flat against that clipping edge. 18px
       comfortably clears both effects so the glow is never cut off again.  */
    padding: 18px 18px 30px;
  }

  .btn{
    --btn-color: var(--accent);
    position:relative;
    background: linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
    border: 3px solid var(--border);
    border-radius: var(--radius);
    /* Tiles must read as raised objects sitting ON the background, not as
       patches of it. On the light, patterned themes this outline is the
       difference between "clear" and "where does the tile end?" */
    outline: 1px solid var(--tile-edge, transparent);
    outline-offset: -4px;
    padding: 34px 26px;
    /* NO min-height. This used to be 190px, and it is what kept the tiles
       cut off at the bottom of the TVs: the grid works out exactly how tall
       each row may be to fit the screen, and a min-height on the button
       silently overrode that and pushed the last row off the edge. The row
       height computed in fitGrid() is the single source of truth now. */
    min-height: 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px;
    color: var(--text);
    cursor: pointer;
    text-align:center;
    /* ONLY transform is animated, and that is deliberate.
       This used to animate box-shadow and the gradient background as well,
       and on the TVs it visibly stuttered every time the cursor moved. The
       reason is that a browser can slide, scale and fade a layer on the
       graphics chip for almost nothing, but a changing shadow or gradient
       has to be REDRAWN, pixel by pixel, every frame — and it happens on two
       tiles at once, the one being left and the one being landed on. On a
       desktop that is invisible; on a £25 streaming stick it is the lag.
       The glow now lives on a pseudo-element whose opacity is faded instead,
       which the graphics chip handles for free, and the border and
       background switch instantly (during a 120ms zoom nobody can tell). */
    transition: transform .12s ease;
    box-shadow: 0 14px 30px rgba(0,0,0,0.35);
  }
  /* The focus glow, as its own layer purely so it can be faded rather than
     repainted. No background of its own — a shadow draws outside the box, so
     this never covers the thumbnail or the title. */
  .btn::before{
    content:'';
    position:absolute; inset:0;
    border-radius: inherit;
    box-shadow: var(--focus-ring), 0 18px 34px rgba(0,0,0,0.45);
    opacity:0;
    transition: opacity .12s ease;
    pointer-events:none;
  }
  .btn.focused::before{ opacity:1; }
  /* text-shadow, not filter: drop-shadow. They look the same here, but a
     filter forces the whole tile through an extra per-pixel pass on every
     paint, eleven tiles at a time, on hardware that has little to spare. */
  .btn .icon{ font-size: clamp(3.4rem, 6vw, 5.2rem); line-height:1; text-shadow: 0 4px 10px rgba(0,0,0,.4); }
  .btn .label{ font-family:'Fredoka', sans-serif; font-weight:600; font-size: clamp(1.5rem, 2.4vw, 2rem); line-height:1.15; }
  .btn:hover{ border-color: var(--btn-color); }
  .btn.focused{
    /* Always the same orange, never the per-room color: from the back of a
       classroom the only thing that matters is instantly seeing which tile is
       selected, and one consistent highlight colour reads faster than one
       that changes meaning by room. It also matches the orange glow around
       it, instead of ringing a blue border with an orange halo. */
    border-color: var(--accent);
    background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    transform: scale(1.045);
    /* the glow is on .btn::before above, so it can fade instead of repaint */
  }
  .btn:active{ transform: scale(0.98); }
  /* Folder buttons ("Week 1", "Week 2") open a sub-list instead of playing a
     video right away — a dashed border is the one visual hint that this
     button leads somewhere else rather than starting a video immediately. */
  .btn-folder{ border-style: dashed; }

  /* Video buttons: while a thumbnail is loading (or if it fails to load —
     e.g. the file isn't shared/viewable) the button quietly stays in its
     plain icon+label look, so nothing ever looks broken. Once a thumbnail
     loads successfully, .has-thumb switches it to a full-tile picture with
     just the title, drop-shadowed so it reads over any image underneath. */
  .btn-video.has-thumb{
    background-image: var(--btn-thumb);
    background-size: cover;
    background-position: center;
    justify-content: flex-end;
    padding: 20px 18px 18px;
  }
  .btn-video.has-thumb .icon{ display:none; }
  /* A thumbnail is a frame of someone else's video — it can be white sky,
     bright yellow, anything. A text shadow alone isn't always enough to keep
     a title readable against that. This lays a soft darkening gradient over
     just the bottom of the tile, under the title only, so the words are
     always legible without dimming the picture itself. */
  .btn-video.has-thumb::after{
    content:'';
    position:absolute; left:0; right:0; bottom:0; height:58%;
    border-radius: 0 0 calc(var(--radius) - 3px) calc(var(--radius) - 3px);
    background: linear-gradient(to top, rgba(3,7,18,0.88), rgba(3,7,18,0.45) 45%, rgba(3,7,18,0));
    pointer-events:none;
  }
  .btn-video.has-thumb .label{
    position:relative; z-index:1;
    /* ALWAYS light, whatever the theme says.
       The gradient beneath this text is dark in every theme (it has to be —
       it exists to darken whatever photo is behind it). The themes with light
       backgrounds set --text to a near-black, and inheriting that put dark
       text on a dark scrim: measured contrast of 1.2:1 against a 4.5:1
       standard, i.e. essentially unreadable. The tile background may follow
       the theme; a label sitting on a photo may not. */
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 3px 12px rgba(0,0,0,.7);
  }

  #emptyState{
    grid-column: 1/-1;
    color: var(--muted);
    text-align:center;
    padding: 60px 20px;
    font-size: 1.2rem;
    line-height:1.6;
  }

  .pill-btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:1.05rem;
    padding: 16px 26px; border-radius:999px;
    background: var(--bg-panel-2); color: var(--text);
    border: 2px solid var(--border);
    display:flex; align-items:center; gap:10px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .pill-btn.focused, .pill-btn:hover{ border-color: var(--accent); transform: scale(1.04); }
  .pill-btn.primary{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* A quiet corner exit, not a website "button" — small, low-contrast until
     focused/hovered, icon only. A safety net for exiting a video, kept
     deliberately understated so it doesn't read as on-screen instruction. */
  .exit-btn{
    appearance:none; cursor:pointer;
    width:52px; height:52px; border-radius:50%;
    background: rgba(15,20,35,0.45);
    border: 1px solid rgba(255,255,255,0.16);
    color: rgba(255,255,255,0.55);
    font-size: 1.3rem;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .exit-btn:hover, .exit-btn:focus, .exit-btn.focused{
    background: rgba(15,20,35,0.85); color:#fff; border-color: var(--accent); transform: scale(1.06);
  }

  /* =================================================================
     THE ONE-LINE RULE THAT MADE EVERYTHING ELSE LOOK BROKEN
     =================================================================
     Panels here are shown/hidden with the HTML `hidden` attribute
     (el.hidden = true/false). A browser's built-in stylesheet turns that
     into `display: none` — but ONLY at the weakest possible priority. Any
     `display` rule written in this file (and `.player-error` and
     `.player-loading` both set `display:flex`) silently outranks it.

     The result: those two full-screen, solid-black panels stayed painted
     over the player forever, no matter what `hidden` said. Videos really
     were playing — measured readyState 4, correct dimensions, audio
     audible — behind a black rectangle that claimed they had failed. The
     same panel covered every picture. Every "this file won't load" report
     traced back to this line being absent.

     Declaring it explicitly, with !important, makes `hidden` mean hidden
     everywhere on the page, permanently.
     ================================================================= */
  [hidden]{ display:none !important; }

  /* ---------- PLAYER LAYER ---------- */
  #player{
    position:fixed; inset:0; background:#000; z-index:20;
    display:none;
  }
  #player.open{ display:block; }
  #playerFrameWrap{ position:absolute; inset:0; width:100%; height:100%; }
  #player iframe, #player video{ display:block; width:100%; height:100%; border:none; }
  /* Pictures (memory-verse graphics, activity pages, etc.) use object-fit:
     contain rather than the video/iframe default — a photo can be any shape
     (square, portrait, whatever a phone camera produced), and stretching it
     to fill the TV screen exactly would distort faces and text. Letterboxing
     on black keeps it looking intentional instead of broken. */
  #player img{ display:block; width:100%; height:100%; object-fit:contain; background:#000; }
  /* ---------- PLAYER CHROME THAT GETS OUT OF THE WAY ----------
     A back arrow burned into the corner of every video is clutter on a wall
     that a whole classroom is looking at. So the controls fade out a few
     seconds after the last button press and come straight back the moment
     anyone touches the remote — the same way a TV's own on-screen controls
     behave, which is what teachers already expect. They also stay put
     whenever the video is paused, because a paused screen with no visible
     controls just looks broken.
     Visibility is done with opacity (not `hidden`) so the fade is smooth and
     the button keeps its place in the layout. `pointer-events:none` while
     faded stops a stray tap landing on something invisible. */
  #playerBackBtn{
    transition: opacity .45s ease, transform .2s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  /* No back arrow over the picture, ever. The remote's own BACK button is the
     way out; an arrow burned into the corner of a classroom wall is clutter.
     The element stays in the page (so nothing referencing it breaks) but is
     never rendered. */
  #player #playerBackBtn{ display:none !important; }

  /* Shown centre-screen only while a video is actually paused. */
  #pauseBadge{
    position:absolute; inset:0; z-index:21; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition: opacity .25s ease;
  }
  /* The same shape YouTube uses: a soft dark circle with a plain white glyph,
     no ring, no outline. It reads over a bright title slide and over black
     letterbox bars equally well, and it looks like something people have
     already seen a thousand times rather than something invented here. */
  /* The glyph is ONE drawn shape, not two coloured boxes side by side.
     On the TVs the old version rendered as a plain black circle — the white
     bars simply weren't there — while looking perfect in desktop Chrome. That
     is the kind of difference that comes from an older WebView handling flex
     spacing or child backgrounds differently, and it is not worth diagnosing
     remotely when the fix removes the whole class of problem: an SVG with an
     explicit white fill draws identically on every renderer. */
  #pauseBadge .bars{
    width:132px; height:132px; border-radius:50%;
    background: rgba(0,0,0,0.66);
    display:flex; align-items:center; justify-content:center;
    transform: scale(0.86);
    transition: transform .18s cubic-bezier(.2,.9,.3,1.4);
  }
  #player.is-paused #pauseBadge .bars{ transform: scale(1); }
  #pauseBadge .bars svg{ display:block; width:52%; height:52%; }

  #player.is-paused #pauseBadge{ opacity:1; }

  .player-error{
    position:absolute; inset:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:40px;
  }
  .player-error .glyph{ font-size:4rem; }
  .player-error p{ color:var(--muted); font-size:1.3rem; max-width:640px; margin:0; }
  /* Small, quiet technical line under the friendly message — invisible unless
     something is actually wrong, but when it shows up it turns a screenshot
     of this screen into something we can diagnose without a back-and-forth:
     it names the exact reason the browser gave up (stalled vs. a real
     decode/format problem vs. a network hiccup) instead of just "broken." */
  .player-error .err-detail{
    color:rgba(255,255,255,0.35); font-size:0.85rem; max-width:640px;
    margin:0; font-family:ui-monospace, monospace;
  }

  /* Shown the instant a video is picked, until real playback actually
     starts. A video routed through the Drive-resolving helper can
     legitimately take a while to produce its first frame — without this,
     the screen just looks like a dead black rectangle the whole time,
     which reads as broken even when it's genuinely still on its way. */
  .player-loading{
    position:absolute; inset:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:40px;
  }
  .player-loading .spinner{
    width:64px; height:64px; border-radius:50%;
    border: 6px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    animation: ktv-spin 0.9s linear infinite;
  }
  .player-loading p{ color:var(--muted); font-size:1.2rem; margin:0; }
  .player-loading .pct{ color:var(--muted); font-size:1rem; margin:0; opacity:.8; font-variant-numeric:tabular-nums; }
  @keyframes ktv-spin{ to{ transform: rotate(360deg); } }
  #backBar{
    position:absolute; top:26px; left:26px; z-index:21;
    display:flex; gap:14px;
  }

  /* focus outline reset — we draw our own */
  button{ font: inherit; }
  button:focus{ outline:none; }
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:10px; }
</style>
</head>
<body>

  <!-- SCREENSAVER (default resting state) -->
  <div id="screensaver">
    <!-- The logo is USUALLY a picture now. A picture beats a looping video
         here on every count: it appears at once, it downloads once and then
         costs nothing, and — the part that isn't obvious — it stops the TV
         decoding video frames forever in the background, which is work a
         £25 streaming stick has to take away from something else. A video
         still works if one is used; the app works out which it has. -->
    <img id="screensaverImage" alt="" hidden>
    <video id="screensaverVideo" autoplay loop playsinline hidden></video>
    <!-- The songs play from here, separately from the logo loop. Keeping them
         apart is what lets the logo be a few seconds long (so it appears at
         once and then costs nothing) while the music stays as varied as you
         like. -->
    <audio id="screensaverMusic" preload="none"></audio>
    <div id="screensaverFallback">
      <div class="glyph">✝️</div>
      <h1 class="display-font" id="fallbackTitle">Kids Ministry</h1>
      <p>Put your logo picture in Drive and paste its ID into <code>SCREENSAVER_FILE_ID</code> to show it here.</p>
    </div>
  </div>

  <!-- THEME PICKER. Opened from the screensaver with two LEFT presses. -->
  <div id="themePicker" hidden>
    <div class="tp-head">
      <h2 class="display-font">Pick a look for this TV</h2>
      <p>Arrows to browse · OK to keep it · Back to leave it as it was</p>
    </div>
    <div class="tp-grid" id="tpGrid"></div>
  </div>

  <!-- MENU (button grid) -->
  <div id="menu">
    <div class="menu-header">
      <h1 class="display-font" id="menuTitle">Select a Video</h1>
      <div class="status" id="statusLine" title="Loading…"><span class="dot"></span></div>
    </div>
    <div id="buttonGrid"><div id="emptyState">Loading the lesson list…</div></div>
    <div style="display:flex; justify-content:flex-end;">
      <button class="exit-btn" id="menuCloseBtn" aria-label="Back to screensaver" title="Back to screensaver">↩</button>
    </div>
  </div>

  <!-- PLAYER (fullscreen video) -->
  <div id="player">
    <div id="backBar">
      <button class="exit-btn" id="playerBackBtn" aria-label="Back to menu" title="Back to menu">◀</button>
    </div>
    <div id="playerFrameWrap"></div>
  </div>

<script>
/* =====================================================================
   CONFIG — EDIT ME
   This is the only section you should need to change.
   ===================================================================== */
// Bump this whenever the file changes. It is the ONLY thing the update check
// below compares, so it must be different from the version currently on the
// TVs for them to notice a new release.
const KTV_BUILD = "2026-09-06i";

const CONFIG = {
  // The published CSV link from your Google Sheet (File > Share > Publish to web).
  // See the setup guide for exactly how to get this.
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJ6toT0PQzJDJKOStGySWb51A3-No6YYsAsqMECnACmxkQRH5yaD-Ak28PqF7Nrhdrm-SnlanGliWT/pub?output=csv",

  // Text shown at the top of the button screen and on the fallback screensaver.
  MENU_TITLE: "Welcome to First Kids!",
  CHURCH_NAME: "Kids Ministry",

  // How many buttons per row on the TV.
  GRID_COLUMNS: 3,

  // How often (in minutes) the TV checks the Google Sheet for changes.
  // 5 is a good default — Mom's edits show up within 5 minutes on every TV.
  REFRESH_MINUTES: 5,

  // If a teacher opens a video and walks away, automatically return to the
  // screensaver after this many minutes of no interaction. Set to 0 to disable.
  IDLE_RETURN_MINUTES: 45,

  // How long the BUTTON MENU may sit untouched before the TV drops back to
  // the logo. This exists because of a real fault: the menu used to cancel
  // the idle timer and never restart it, so the moment a lesson video ended
  // the TV returned to the menu and stayed there — for the rest of the
  // morning, on every screen, with the logo loop gone and a static grid
  // burning into the panel. Any remote press resets this, so it can only
  // fire when the room has genuinely moved on.
  MENU_IDLE_MINUTES: 3,

  // When a video reaches its end, go back to the list of videos automatically
  // instead of leaving a frozen last frame on the wall. Set to false if you'd
  // rather it just stop on the final frame.
  RETURN_TO_MENU_WHEN_VIDEO_ENDS: true,

  // Default color for buttons that don't specify their own color in the sheet.
  DEFAULT_BUTTON_COLOR: "#f6ad37",

  // Icon + color for the folder buttons that open a week's videos (e.g.
  // "Week 1", "Week 2") when a Drive room folder has subfolders inside it.
  FOLDER_ICON: "📁",
  FOLDER_COLOR: "#64748b",

  // Where to find the screensaver video. Leave as "screensaver.mp4" if that
  // file sits right next to this page on the same site. If it's too big to
  // upload through GitHub (its web uploader tops out well under this app's
  // typical screensaver size) and you hosted it on its own separate site

  // or the value (?room=, ?Room=, ?ROOM=Elementary all work) — 10 Fire Sticks

  const params = new URLSearchParams(location.search);

/* ---------------------- Screensaver video ---------------------- */
// Tries to load and play the screensaver directly, and only shows the
// friendly fallback if the <video> element itself reports a real failure
// (file missing, bad URL, unsupported format). This intentionally does NOT
// pre-check the file with a fetch() first — a fetch() to a different site
// (SCREENSAVER_URL hosted on its own separate site, its own address) needs
// a cross-origin permission a plain video file doesn't send by default,
// which made that pre-check fail even when the video itself was completely
// fine. A <video> element loading a file doesn't have that restriction, so
// checking this way works identically whether the file is on this same
// site or a different one.
// Every place the screensaver loop could come from, cheapest first. This
// matters more than it looks: the screensaver is the one video that plays
// on all ten TVs continuously, all morning. Served from our own website
// that is, by a wide margin, the single largest thing the site does — a
// two-hour loop re-fetched by ten TVs runs into many gigabytes a Sunday,
// which is exactly the kind of number that exhausts a free hosting plan
// and takes the whole dashboard offline with it. Fetched straight from
// Google Drive instead, it costs the website nothing at all.
function screensaverSources(){
  const list = [];
  const key = (CONFIG.GOOGLE_API_KEY || '').trim();
  const id = (CONFIG.SCREENSAVER_FILE_ID || '').trim();
  if (key && id) {
    const apiUrl = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) +
                   '?alt=media&key=' + encodeURIComponent(key);
    list.push({ url: apiUrl, crossOrigin: 'anonymous' });
    list.push({ url: apiUrl, crossOrigin: null });
  }
  if (CONFIG.SCREENSAVER_URL) list.push({ url: CONFIG.SCREENSAVER_URL, crossOrigin: null });
  if (id && !key) list.push({ url: '/watch-video?id=' + encodeURIComponent(id), crossOrigin: null });
  return list;
}

// Whether the logo turned out to be a picture. Nothing else in the page needs
// to care, but the sound handling does: a picture has no audio of its own, so
// the songs become the only thing that can make a noise.
let screensaverIsImage = false;

(function initScreensaver(){
  const sources = screensaverSources();
  if (!sources.length) { showScreensaverFallback(); return; }

  const kind = String(CONFIG.SCREENSAVER_KIND || 'auto').toLowerCase();

  // PICTURE FIRST, unless told otherwise.
  //
  // There is no way to tell from a Drive file ID alone whether it points at a
  // .jpg or an .mp4, and asking Google first would cost a whole extra round
  // trip before anything could appear. So we simply try to load it as a
  // picture: a browser decides that in the first few bytes, and if it isn't
  // one it fails almost immediately and we hand the same address to the video
  // element instead. Whichever kind of file gets uploaded, it just works.
  function tryImage(i){
    if (kind === 'video' || i >= sources.length) { startVideo(0); return; }
    const probe = new Image();
    if (sources[i].crossOrigin) probe.crossOrigin = sources[i].crossOrigin;
    probe.onload = () => {
      screensaverIsImage = true;
      // IMPORTANT: the probe deliberately uses the RAW file bytes, not
      // Google's image CDN. The CDN happily returns a poster frame for a
      // VIDEO, so probing it would call every video screensaver a picture and
      // freeze it on one frame. The raw bytes are the only honest test.
      // Having established it really is a picture, display it from the CDN,
      // which is faster and does not rate-limit with ten TVs asking at once.
      const id = (CONFIG.SCREENSAVER_FILE_ID || '').trim();
      const cdn = id ? 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w1920' : '';
      screensaverImage.onerror = () => { screensaverImage.onerror = null; screensaverImage.src = sources[i].url; };
      screensaverImage.src = cdn || sources[i].url;
      screensaverImage.hidden = false;
      screensaverVideo.hidden = true;
      // A picture cannot make a sound, so the logo video must never be asked
      // to; the songs own the audio from here.
      try { screensaverVideo.removeAttribute('src'); screensaverVideo.load(); } catch (e) {}
    };
    probe.onerror = () => {
      if (kind === 'image') { tryImage(i + 1); return; }   // forced: keep trying pictures
      startVideo(0);                                        // otherwise it must be a video
    };
    probe.src = sources[i].url;
  }

  function startVideo(i){
    if (i >= sources.length) { showScreensaverFallback(); return; }
    screensaverIsImage = false;
    screensaverVideo.hidden = false;
    screensaverImage.hidden = true;
    const s = sources[i];
    if (s.crossOrigin) screensaverVideo.setAttribute('crossorigin', s.crossOrigin);
    else screensaverVideo.removeAttribute('crossorigin');
    // Only while we are still choosing an address. Left attached, a single
    // hiccup hours later would walk off the end of the list and replace the
    // logo with the "add a screensaver" card for the rest of the day, with
    // nothing anywhere to put it back.
    screensaverVideo.onerror = () => { if (screensaverVideo.readyState === 0) startVideo(i + 1); };
    screensaverVideo.addEventListener('playing', () => { screensaverVideo.onerror = null; }, { once: true });
    screensaverVideo.src = s.url;
    screensaverVideo.load();
    screensaverVideo.play().catch(() => {
      // Autoplay-with-sound was blocked by the browser. Fall back to
      // muted autoplay so at least the picture loops; a single tap
      // anywhere unmutes it (kiosk browsers usually allow this).
      screensaverVideo.muted = true;
      screensaverVideo.play().catch(()=>{});
    });
  }

  screensaverVideo.muted = false;
  tryImage(0);
})();

function showScreensaverFallback(){
  screensaverImage.hidden = true;
  screensaverVideo.style.display = 'none';
  screensaverFallback.style.display = 'flex';
}

// Some browsers — and especially some kiosk-browser apps' built-in web
// views — won't actually start ANY video playback, even muted, until a
// real button press has happened somewhere on the page; the automatic
// play() attempt at page load can fail silently with nothing to react to,
// leaving the screensaver stuck on a blank black frame until something
// else happens to call play() again (which is why going into the menu and
// back out "fixed" it — that later play() call finally had a real press
// behind it). The very first press/tap anywhere kicks the video into
// gear for real, and unmutes it too, with no on-screen instruction needed
// — it just starts working normally from then on.
function primeScreensaverOnFirstPress(){
  // Always (re)try play() — harmless if it's already playing, and this is
  // what actually gets a stuck/never-started video going for the first time.
  screensaverVideo.play().catch(() => {});
  if (screensaverVideo.muted) {
    // Unmute at silence, not full volume — the same key press is about to
    // open the menu (which ducks audio anyway), so this avoids a jarring
    // half-second blast of full-volume sound right as the screen changes.
    screensaverVideo.volume = 0;
    screensaverVideo.muted = false;
    screensaverVideo.play().catch(() => {});
  }
  // Browsers refuse to start sound until a real button has been pressed, and
  // the songs are subject to that rule just as the video was.
  startMusic();
  document.removeEventListener('keydown', primeScreensaverOnFirstPress, true);
  document.removeEventListener('click', primeScreensaverOnFirstPress, true);
}

/* One place where a freshly loaded list of rows is split into the two things
   it actually contains: tiles for the grid, and songs for the screensaver.
   Every path that loads rows — a live sync, a cached list, a boot with the

/* ---------------------- CSV loading ---------------------- */
function parseCSV(text){
  // Minimal RFC4180-ish CSV parser: handles quoted fields with commas
  // and escaped quotes, which a plain text.split(',') cannot.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ''));
}

// The seventh column has held two different things over this app's life: on
// older sheets it's a "Last Synced" timestamp, and on current ones it's the
// file's real format ("video/mp4"). Rather than guess by which version of the
// sync script is installed — and rather than tell a teacher a Bible story is
// "not a video" because a date landed in that column — only accept a value
// that actually looks like a format, and ignore anything else.
function sanitizeMimeType(raw){
  const v = String(raw || '').trim().toLowerCase();
  if (!v) return '';
  return /^[a-z0-9.+-]+\/[a-z0-9.+-]+$/.test(v) ? v : '';
}

function extractDriveId(raw){
  if (!raw) return null;
  raw = raw.trim();
  // Already a bare file ID (no slashes or spaces)
  if (/^[a-zA-Z0-9_-]{15,}$/.test(raw)) return raw;
  // Full share link: .../d/FILEID/...
  let m = raw.match(/\/d\/([a-zA-Z0-9_-]{15,})/);
  if (m) return m[1];
  // ?id=FILEID style link
  m = raw.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
  if (m) return m[1];
  return null;
}

async function loadConfigFromSheet(){
  try {
    const res = await fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (!rows.length) throw new Error('Sheet came back empty');

    // Skip header row (first row). Columns: Label, Drive Link or File ID,
    // Color (optional), Icon (optional), Room (optional), Group (optional —
    // which week/subfolder a video came from; blank = shows on the main menu),
    // Type (optional — the file's real format, e.g. "video/mp4", written by
    // the sync script; blank on older sheets, which is fine: it's only used
    // to explain a failure more precisely if one happens), Size MB (optional
    // — how patient to be while this file starts).
    const parsedAll = rows.slice(1).map(r => ({
      label: (r[0] || '').trim(),
      fileId: extractDriveId(r[1] || ''),
      color: (r[2] || '').trim() || CONFIG.DEFAULT_BUTTON_COLOR,
      icon: (r[3] || '').trim() || '▶️',
      room: (r[4] || '').trim().toLowerCase(),
      group: (r[5] || '').trim(),
      type: sanitizeMimeType(r[6]),
      // How big the file is, in megabytes, as written by the sync script.
      // Only used to decide how patient to be while a video is starting: a
      // 250MB video legitimately needs longer than a 20MB one before we are
      // willing to call it broken. Blank on older sheets, which is fine —
      // the code falls back to its floor.
      // Strictly numeric, for the same reason as Minutes below: a sheet whose
      // columns have shifted could otherwise put a date like "9/6/2026" here,
      // which parseFloat happily reads as 9 — and a 9MB estimate would cut
      // every video's patience budget to almost nothing.
      sizeMb: /^\s*\d+(\.\d+)?\s*$/.test(String(r[7] || '')) ? Math.max(0, Math.round(parseFloat(r[7]))) : 0,
      // How many minutes long the video is. This — not the file size — is
      // what decides how long the TV should wait before it is willing to call
      // a video broken. Blank on older sheets; the code estimates instead.
      // Only trust a cell that is PURELY a number. On a sheet made before the
      // Minutes column existed, position 9 holds the "Last Synced" stamp, and
      // a loose parseFloat on something like "6 Sep" would read it as a
      // 6-minute video and cut the patience budget to nothing.
      minutes: /^\s*\d+(\.\d+)?\s*$/.test(String(r[8] || '')) ? Math.max(0, parseFloat(r[8])) : 0
    })).filter(b => b.label && b.fileId);

    if (!parsedAll.length) throw new Error('No valid rows found (check Label + Drive link columns)');

    const parsed = parsedAll.filter(b => !ROOM || !b.room || b.room === 'both' || b.room === ROOM);

    if (!parsed.length) {
      // Distinguish "the sheet is broken" from "this room just has nothing
      // assigned yet" — very different fixes, so worth telling apart.
      throw new Error(ROOM
        ? 'The sheet has videos, but none tagged for room "' + ROOM + '" (or "Both") yet'
        : 'No valid rows found (check Label + Drive link columns)');
    }

    applyRows(parsed);
    forgetWarmFailures();   // a new list deserves a clean slate
    // If the folder/week the teacher currently has open got renamed or
    // removed in this sync, don't strand them on a dead sub-list — fall
    // back to the main menu next render.
    if (activeGroup && !buttons.some(b => b.group === activeGroup && (b.room || '') === (activeGroupRoom || ''))) { activeGroup = null; activeGroupRoom = null; }
    // Save the whole list, songs included — a TV that starts up before the
    // Wi-Fi is awake should come back with its music as well as its buttons.
    try { localStorage.setItem('ktv_last_good_config', JSON.stringify(parsed)); } catch(e) {}
    loadThumbnailsUpFront(buttons);
    // ONLY REDRAW IF SOMETHING ACTUALLY CHANGED.
    //
    // This runs every five minutes, all morning. Redrawing unconditionally
    // meant renderButtons() reset the cursor to the first tile — so a teacher
    // who had arrowed across to "Week 3 · Bible Story" and pressed OK a
    // moment after a refresh landed would start the wrong video in front of
    // the class. Roughly fifty chances to do that over a morning.
    const signature = JSON.stringify(buttons.map(x => [x.label, x.fileId, x.group, x.room, x.type]));
    if (signature !== lastRenderSignature) {
      lastRenderSignature = signature;
      renderButtons();
      updateMenuTitle();
      updateBackButtonLabel();
    }
    setStatus(true);
  } catch (err) {
    console.warn('Sheet load failed, using last known good config:', err);
    setStatus(false);
    if (!buttons.length) {
      try {
        const cached = JSON.parse(localStorage.getItem('ktv_last_good_config') || 'null');
        if (cached && cached.length) {
          applyRows(cached);
          if (activeGroup && !buttons.some(b => b.group === activeGroup && (b.room || '') === (activeGroupRoom || ''))) { activeGroup = null; activeGroupRoom = null; }
          loadThumbnailsUpFront(buttons);
          renderButtons();
          updateMenuTitle();
          updateBackButtonLabel();
        }
      } catch(e) {}
    }
    if (!buttons.length) renderEmptyState(err.message);
  }
}

function setStatus(isLive){
  statusLine.className = 'status' + (isLive ? '' : ' stale');
  statusLine.title = isLive ? 'Up to date' : 'Showing last saved list (couldn’t reach the sheet)';

  buttonGrid.innerHTML = '<div id="emptyState">No videos to show yet.<br>' +

/* ---------------------- Folders (weekly subfolders) ----------------------
   Mom's Elementary/Preschool Drive folders contain "Week 1", "Week 2" style
   subfolders. The sync script tags each video with which subfolder (if any)
   it came from as its "group". A video with no group (loose in the room's
   top folder) shows directly on the main menu, same as always. A video
   with a group doesn't show directly — instead, one folder button per
   distinct group appears (e.g. "Week 1"), and clicking it opens a
   sub-list of just that week's videos, with the same back button one
   level up to the main menu. */
// A row is a picture (not a video) when the sync script recorded its real
// format as "image/...". Older sheets (or a hand-added row with no Type
// filled in) have no type at all — those default to 'video', exactly the
// behavior this app always had, so nothing changes for anyone who hasn't
// re-synced yet.
function mediaKind(b){
  return (b.type && b.type.indexOf('image/') === 0) ? 'image' : 'video';
}

function computeVisibleItems(){
  if (activeGroup) {
    const inGroup = buttons
      .filter(b => b.group === activeGroup && (b.room || '') === (activeGroupRoom || ''))
      .map(b => ({ kind: mediaKind(b), data: b }));
    // First tile inside every folder is a one-press way back to the logo loop,
    // so a teacher never has to climb back out through the menus to reset the
    // screen between services.
    return [{ kind: 'screensaver' }].concat(inGroup);
  }
  const videoEntries = buttons.filter(b => !b.group).map(b => ({ kind: mediaKind(b), data: b }));
  const seen = new Set();
  const folderEntries = [];
  buttons.forEach(b => {
    if (!b.group) return;
    const key = (b.room || '') + '\u0000' + b.group;   // room + name, so identical names stay separate
    if (seen.has(key)) return;
    seen.add(key);
    folderEntries.push({ kind: 'folder', name: b.group, room: b.room || '' });
  });
  return videoEntries.concat(folderEntries);
}

/* ============ MAKE THE TILES FIT THE SCREEN THEY ARE ON ============
   The old layout guessed a row height from `vh` units. That guess was fine in
   a desktop browser and wrong on the TVs, where the second row of tiles hung
   off the bottom edge and got cut in half.

   This measures the height the grid genuinely has after layout, divides it by
   the number of rows actually being shown, and sets the row height to the
   result — so a folder of six tiles fills the screen exactly, with nothing
   clipped, on any panel, at any resolution, in any theme.

   If there are so many tiles that fitting them would make each one unusably
   small, the row height stops at a sensible minimum and the grid scrolls
   instead (arrow keys still move focus through it normally).
   ================================================================ */
/* ============ MAKE THE TILES FIT THE SCREEN THEY ARE ON ============
   The layout used to guess a row height from `vh` units. That guess was fine
   in a desktop window and wrong on the TVs, where the bottom row hung off the
   edge and got sliced in half.

   This works it out from the space that genuinely exists, and it is allowed to
   change the number of columns to do it: eleven week-folders as 3 columns is
   four rows of squashed tiles, but as 4 columns it is three comfortable ones.

   Then — because a computed answer can still be defeated by some other rule in
   the stylesheet, which is exactly what happened before — it MEASURES the
   result and shrinks the rows until nothing overflows. That last loop is the
   guarantee: whatever else is going on, the bottom row cannot be cut off
   unless the tiles have already been shrunk to the smallest readable size.
   ================================================================ */
const TILE_MIN_H = 120;   // below this a tile is unreadable across a classroom
const TILE_MIN_W = 210;
const MAX_COLS   = 6;

let currentCols = 3;      // what the layout chose; arrow-key navigation follows it

function fitGrid(){
  const count = visibleItems.length;
  if (!count) return;
  const s = getComputedStyle(buttonGrid);
  const rowGap = parseFloat(s.rowGap) || 0;
  const colGap = parseFloat(s.columnGap) || rowGap;
  const padY = (parseFloat(s.paddingTop) || 0) + (parseFloat(s.paddingBottom) || 0);
  const padX = (parseFloat(s.paddingLeft) || 0) + (parseFloat(s.paddingRight) || 0);
  const availH = buttonGrid.clientHeight - padY;
  const availW = buttonGrid.clientWidth - padX;
  if (availH <= 0 || availW <= 0) return;      // not laid out yet

  const startCols = Math.max(1, CONFIG.GRID_COLUMNS);
  let chosen = null;

  // Try the preferred column count first, then wider arrangements. The first
  // one whose tiles are still a decent size wins, which keeps them as large
  // as possible while fitting everything on one screen.
  for (let cols = startCols; cols <= Math.max(startCols, MAX_COLS); cols++) {
    const rows = Math.ceil(count / cols);
    const tileW = (availW - colGap * (cols - 1)) / cols;
    if (tileW < TILE_MIN_W && cols > startCols) break;   // any wider and they get too narrow
    let rowH = Math.floor((availH - rowGap * (rows - 1)) / rows);
    rowH = Math.min(rowH, Math.round(tileW * 0.75));     // never taller than it is wide
    if (rowH >= TILE_MIN_H) { chosen = { cols: cols, rowH: rowH }; break; }
  }

  // Nothing fits comfortably (a very long list): use the widest sensible
  // layout at the smallest readable size and let it scroll.
  if (!chosen) {
    const cols = Math.min(MAX_COLS, Math.max(startCols, Math.floor((availW + colGap) / (TILE_MIN_W + colGap))));
    chosen = { cols: Math.max(1, cols), rowH: TILE_MIN_H };
  }

  currentCols = chosen.cols;
  buttonGrid.style.setProperty('--cols', currentCols);
  buttonGrid.style.setProperty('--row-h', chosen.rowH + 'px');

  // THE GUARANTEE. Measure what actually happened and keep shrinking until it
  // fits, so no other rule in the stylesheet can push a row off the screen.
  let h = chosen.rowH;
  let guard = 0;
  while (buttonGrid.scrollHeight > buttonGrid.clientHeight + 1 && h > TILE_MIN_H && guard++ < 40) {
    h -= 6;
    buttonGrid.style.setProperty('--row-h', h + 'px');
  }
}

// A TV can report its size late, and Fully Kiosk changes it when it goes
// full-screen, so re-measure whenever the window changes.
window.addEventListener('resize', () => {
  try { fitGrid(); } catch (e) {}
  // A TV can report its size late, and the picker's column count is worked
  // out from that size — so re-apply it rather than leaving cards clipped.
  try { if (tpOpen) { tpGrid.style.setProperty('--tp-cols', tpColumns()); tpApplyFocus(); } } catch (e) {}
});

// A stable name for a tile, so the cursor can be put back on the same one
// after a redraw even though the objects themselves are rebuilt.
function tileKey(it){
  if (!it) return '';
  if (it.kind === 'screensaver') return 'screensaver';
  if (it.kind === 'folder') return 'folder:' + (it.room || '') + ':' + it.name;
  return 'file:' + ((it.data && it.data.fileId) || '');
}
let keepFocusLabel = null;

function renderButtons(){
  // Remember what the cursor was on before the grid is thrown away.
  keepFocusLabel = tileKey(visibleItems[focusedIndex]);
  const items = computeVisibleItems();
  visibleItems = items;

  if (!items.length) {
    buttonGrid.innerHTML = '<div id="emptyState">' +
      (activeGroup ? ('Nothing in "' + escapeHtml(activeGroup) + '" right now.') : 'No videos to show yet.') +
      '</div>';
    focusedIndex = 0;
    applyFocusVisual();
    return;
  }

  buttonGrid.innerHTML = '';
  items.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.dataset.index = i;
    if (item.kind === 'screensaver') {
      btn.className = 'btn btn-folder btn-screensaver';
      btn.style.setProperty('--btn-color', CONFIG.FOLDER_COLOR);
      btn.innerHTML = '<div class="icon">🏠</div><div class="label">Back to Screensaver</div>';
    } else if (item.kind === 'folder') {
      btn.className = 'btn btn-folder';
      btn.style.setProperty('--btn-color', CONFIG.FOLDER_COLOR);
      // When a TV has NOT been told which room it is (no ?room= on its web
      // address), both rooms' folders are on screen at once — and Drive uses
      // the same week names in both. Showing the room here is what keeps
      // "In Season Week 1" for Elementary distinguishable from Preschool's.
      const prettyRoom = item.room ? (item.room.charAt(0).toUpperCase() + item.room.slice(1)) : '';
      const folderLabel = (!ROOM && prettyRoom) ? (prettyRoom + ' · ' + item.name) : item.name;
      btn.innerHTML = '<div class="icon">' + escapeHtml(CONFIG.FOLDER_ICON) + '</div><div class="label">' + escapeHtml(folderLabel) + '</div>';
    } else {
      const b = item.data;
      btn.className = 'btn btn-video';
      btn.style.setProperty('--btn-color', b.color);
      btn.innerHTML = '<div class="icon">' + escapeHtml(b.icon) + '</div><div class="label">' + escapeHtml(b.label) + '</div>';
      attachThumbnail(btn, b.fileId);
    }
    btn.addEventListener('click', () => activateItem(i));
    buttonGrid.appendChild(btn);
  });
  fitGrid();                                         // size the tiles to this screen
  requestAnimationFrame(fitGrid);                    // and again once layout has settled
  // Keep the cursor where it was if that tile still exists — a redraw should
  // never move a teacher's selection out from under them.
  focusedIndex = (keepFocusLabel && items.findIndex(it => tileKey(it) === keepFocusLabel) >= 0)
    ? items.findIndex(it => tileKey(it) === keepFocusLabel)
    : 0;
  keepFocusLabel = null;
  applyFocusVisual();
  resumeWarming();          // start fetching indexes for what is now on screen
}

function activateItem(i){
  const item = visibleItems[i];
  if (!item) return;
  if (item.kind === 'screensaver') { showScreensaver(); }
  else if (item.kind === 'folder') { enterGroup(item.name, item.room); }
  else if (item.kind === 'image') { showImage(item.data); }
  else { playVideo(item.data); }
}

function enterGroup(name, room){
  activeGroup = name;
  activeGroupRoom = room || '';
  renderButtons();
  updateMenuTitle();
  updateBackButtonLabel();
}

function backToRootMenu(){
  activeGroup = null;
  activeGroupRoom = null;
  renderButtons();
  updateMenuTitle();
  updateBackButtonLabel();
}

// The corner back button (and the remote's Escape/Backspace/Back) goes up
// one level at a time: out of a week folder to the main menu first, and
// only back to the screensaver from the main menu itself.
function handleMenuBack(){
  if (activeGroup) { backToRootMenu(); } else { showScreensaver(); }
}

function updateMenuTitle(){
  const titleEl = document.getElementById('menuTitle');
  titleEl.textContent = activeGroup || CONFIG.MENU_TITLE;
}

function updateBackButtonLabel(){
  const label = activeGroup ? 'Back to menu' : 'Back to screensaver';
  menuCloseBtn.setAttribute('aria-label', label);
  menuCloseBtn.title = label;
}

// The player's own back button returns to wherever the video was picked
// from — the main menu, or the specific week folder it was inside — never
// straight past the menu to the screensaver.
function updatePlayerBackButtonLabel(){
  const label = activeGroup ? ('Back to ' + activeGroup) : 'Back to menu';
  playerBackBtn.setAttribute('aria-label', label);
  playerBackBtn.title = label;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

/* ---------------------- Video thumbnails ---------------------- */
// Uses Google's public thumbnail image for each Drive file so a button
// shows the video's actual picture instead of a generic icon. If a
// particular file's thumbnail doesn't come through (not shared quite
// right, an unusual file type, Google not generating one for it, etc.)
// the button just keeps its plain icon+color look — nothing ever shows
// broken.
//
// Thumbnails are preloaded for every video as soon as the sheet loads
// (see loadThumbnailsUpFront below), not only when a button for them
// happens to get created. Before this, opening a folder built its buttons
// fresh with a plain icon first and only added the picture once a brand
// new Image() finished loading a moment later — so every single time a
// teacher opened a folder (even one they'd already opened before), every
// tile visibly flashed icon-then-photo. Now a shared cache remembers each
// file's thumbnail result across the whole session: once it's loaded once,
// any button for that same file — this visit or a later one — gets the
// picture immediately, with nothing to flash.
const thumbStatus = new Map();      // fileId -> 'loading' | 'loaded' | 'failed'
const thumbWaiters = new Map();     // fileId -> [callback, ...] still waiting on a first-time load

// TWO addresses for the same picture, in order.
//
// lh3.googleusercontent.com is Google's own image service — the one Photos
// and Docs serve pictures from. It is faster than the Drive endpoint and does
// not rate-limit the way `drive.google.com/thumbnail` does when ten TVs ask
// for the same thing at once (which is precisely our situation). Verified
// against this church's own Drive file, anonymously, with a deliberately
// corrupted ID as a control to prove the success was real.
//
// The Drive endpoint stays as the fallback: it is what has been working, and
// nothing here is worth a regression.
function thumbnailUrls(fileId){
  const id = encodeURIComponent(fileId);
  return [
    'https://lh3.googleusercontent.com/d/' + id + '=w800',
    'https://drive.google.com/thumbnail?id=' + id + '&sz=w800'
  ];
}
// Which address actually worked for a given file, so the tile paints with the
// same one that loaded rather than starting the hunt over.
const thumbChosen = new Map();
function thumbnailUrl(fileId){
  return thumbChosen.get(fileId) || thumbnailUrls(fileId)[0];
}

function preloadThumbnail(fileId){
  if (thumbStatus.has(fileId)) return; // already loaded, failed, or already loading — nothing to do
  thumbStatus.set(fileId, 'loading');
  const urls = thumbnailUrls(fileId);
  const settle = (state) => {
    thumbStatus.set(fileId, state);
    const waiters = thumbWaiters.get(fileId) || [];
    thumbWaiters.delete(fileId);
    waiters.forEach(cb => cb(state));
  };
  const attempt = (i) => {
    if (i >= urls.length) { settle('failed'); return; }
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => { thumbChosen.set(fileId, urls[i]); settle('loaded'); };
    img.onerror = () => attempt(i + 1);   // that address didn't work — try the other
    img.src = urls[i];
  };
  attempt(0);
}

// Kicks off loading every known video's thumbnail in the background the
// moment the sheet is parsed — long before a teacher navigates into any
// particular folder — so by the time they do, most (usually all) of that
// folder's thumbnails are already sitting ready in the cache above.
function loadThumbnailsUpFront(list){
  list.forEach(b => preloadThumbnail(b.fileId));
}

function attachThumbnail(btn, fileId){
  const status = thumbStatus.get(fileId);
  if (status === 'loaded') {
    btn.style.setProperty('--btn-thumb', 'url("' + thumbnailUrl(fileId) + '")');
    btn.classList.add('has-thumb');
    return;
  }
  if (status === 'failed') return; // stays icon, matches the old silent-failure behavior
  // Not resolved yet (first time this file's ever been seen, or still
  // mid-flight) — wait for it and apply the moment it resolves. Guarded by
  // `btn.isConnected` because renderButtons() rebuilds every button on each
  // navigation; without that check, a slow thumbnail resolving after the
  // teacher has already moved to a different screen could reach into a
  // button element that isn't even on screen anymore.
  if (!thumbWaiters.has(fileId)) thumbWaiters.set(fileId, []);
  thumbWaiters.get(fileId).push((result) => {
    if (!btn.isConnected) return;
    if (result === 'loaded') {
      btn.style.setProperty('--btn-thumb', 'url("' + thumbnailUrl(fileId) + '")');
      btn.classList.add('has-thumb');
    }
  });
  preloadThumbnail(fileId); // safety net — normally already kicked off by loadThumbnailsUpFront
}

/* ==================== THE SCREENSAVER MUSIC ====================

   WHY THE MUSIC IS NOT PART OF THE LOGO VIDEO ANY MORE
   ----------------------------------------------------
   It used to be one two-hour MP4: logo picture and two hours of songs baked
   together. Two hours of frames means a 7.5MB index, and nothing appears on
   screen until that whole index has downloaded — about thirteen seconds of
   black screen every time a TV starts up. The length was never about the
   picture; it was about not making the leaders listen to the same four songs
   all morning.

   So the two are separated. The logo is a short silent loop, which appears
   almost instantly and then sits in the TV's cache costing nothing. The songs
   are ordinary music files played one after another from here.

   It is also better than what it replaced, not just faster:
     • the order is SHUFFLED, so it differs every service, where a two-hour
       video always played the same songs in the same order
     • adding or dropping a song is dropping a file in a Drive folder — no
       two-hour video to re-export

   Songs come from the same Sheet as everything else: any row whose type is
   audio is music, never a button. If nothing is there, the logo video keeps
   its own sound exactly as before, so this can't leave a room in silence.
   ============================================================== */
const screensaverMusic = document.getElementById('screensaverMusic');
let musicTracks = [];      // shuffled song list
let musicIndex = 0;
let musicStarted = false;
let musicFailures = 0;

// Fisher-Yates. Reshuffled at the end of every pass so a long morning does
// not settle into the same running order after the first time through.
function shuffleTracks(list){
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}

function haveMusic(){ return musicTracks.length > 0; }

// Whichever element is actually carrying sound right now. With songs loaded
// that is the music; without them it is the logo video, as it always was.
function soundEl(){
  if (haveMusic()) return screensaverMusic;
  // A picture logo makes no sound at all, so there is nothing to fade on the
  // video element — point at the (silent, empty) music element instead, where
  // every volume and play() call is a harmless no-op.
  if (screensaverIsImage) return screensaverMusic;
  return screensaverVideo;
}

// What the song list looked like last time, so we can tell a genuine change
// from the sheet simply being re-read.
let musicSignature = '';

function setMusicTracks(rows){
  const songs = rows.filter(b => b.fileId && String(b.type || '').indexOf('audio/') === 0);
  const signature = songs.map(s => s.fileId).sort().join(',');

  if (!songs.length) {
    musicTracks = [];
    musicSignature = '';
    // The logo video was muted so it couldn't talk over the songs. With no
    // songs left there is nothing to talk over, and leaving it muted would
    // mean a completely silent room — no music AND no logo sound — if the
    // music folder ever stops syncing.
    if (!screensaverIsImage) screensaverVideo.muted = false;
    return;
  }

  // A picture logo makes no sound, and a video logo must not compete.
  screensaverVideo.muted = true;

  // THE SHEET IS RE-READ EVERY FIVE MINUTES, ALL MORNING.
  // Rebuilding the playlist on every read meant the worship song playing in
  // the room was cut off mid-verse and restarted from a random track, twelve
  // times an hour, on all ten TVs — almost no song ever reached its own end.
  // Only rebuild when the songs have actually changed.
  if (signature === musicSignature && musicTracks.length) return;

  musicSignature = signature;
  musicTracks = shuffleTracks(songs);
  musicIndex = 0;
  musicSourceIndex = 0;
  musicFailures = 0;
  // Songs have arrived (or changed). If somebody has already pressed a key —
  // which is what browsers require before any sound may start — begin now.
  if (musicStarted || userHasPressedSomething) { musicStarted = true; playCurrentTrack(); }
}

// Which delivery address we are on for the song currently playing. Songs get
// the same courtesy videos do: if the first way of fetching one doesn't work,
// try the other before writing the song off. Dropping a perfectly good song
// because one address had a bad moment is the kind of small wrongness nobody
// ever reports and everybody notices.
let musicSourceIndex = 0;

function playCurrentTrack(){
  if (!haveMusic()) return;
  if (musicIndex >= musicTracks.length) {
    musicIndex = 0;
    musicSourceIndex = 0;
    musicTracks = shuffleTracks(musicTracks);   // a fresh order each pass
  }
  const track = musicTracks[musicIndex];
  const sources = audioSources(track.fileId);
  if (!sources.length || musicSourceIndex >= sources.length) { nextTrack(); return; }
  screensaverMusic.src = sources[musicSourceIndex].url;
  screensaverMusic.load();
  screensaverMusic.play().catch(() => {});
}

function nextTrack(){
  if (!haveMusic()) return;
  musicIndex++;
  musicSourceIndex = 0;
  playCurrentTrack();
}

// Same song, its other address.
function retryTrackOtherSource(){
  musicSourceIndex++;
  playCurrentTrack();
}

// Browsers will not let a page make a sound until a real button has been
// pressed. This records that it has happened, so that songs arriving LATER —
// the sheet is fetched over the network and often lands after the first key
// press — can start straight away instead of waiting for a press that has
// already been and gone. Without it, a TV whose sheet was still loading when
// someone touched the remote stayed silent for the whole morning.
let userHasPressedSomething = false;

function startMusic(){
  userHasPressedSomething = true;
  if (!haveMusic() || musicStarted) return;
  musicStarted = true;
  screensaverMusic.volume = 1;
  playCurrentTrack();
}

screensaverMusic.addEventListener('ended', () => { musicFailures = 0; nextTrack(); });
// Any successful start clears the failure count too, so one bad patch of
// Wi-Fi cannot slowly use up the budget over a long morning.
screensaverMusic.addEventListener('playing', () => { musicFailures = 0; });
screensaverMusic.addEventListener('error', () => {
  // One bad file must not end the music for the morning. Try this song's
  // other address first, then move on — but if everything fails, stop rather
  // than spinning through the list forever hammering Google.
  musicFailures++;
  // Stop hammering Google if everything is failing — but musicStarted stays
  // true, so the next sheet refresh (which resets musicFailures) can bring
  // the music back rather than leaving the room silent for the morning.
  if (musicFailures > musicTracks.length * 2 + 2) return;
  const sources = audioSources((musicTracks[musicIndex] || {}).fileId || '');
  if (musicSourceIndex + 1 < sources.length) { retryTrackOtherSource(); return; }
  nextTrack();
});

/* ---------------------- Screensaver audio fade ---------------------- */
// Fades the screensaver's volume smoothly instead of an abrupt cut/jump,
// so it ducks out when a video is picked and eases back in on return.
let fadeTimer = null;
function fadeScreensaverVolume(target, duration, onDone){
  if (fadeTimer) clearInterval(fadeTimer);
  const el = soundEl();
  const steps = 20;
  const start = el.volume;
  const delta = (target - start) / steps;
  let i = 0;
  fadeTimer = setInterval(() => {
    i++;
    el.volume = Math.max(0, Math.min(1, start + delta * i));
    if (i >= steps) {
      clearInterval(fadeTimer);
      fadeTimer = null;
      el.volume = target;
      if (onDone) onDone();
    }
  }, duration / steps);
}
// Take the logo layer out of the render entirely. The songs are a separate
// element outside it, so the music plays on undisturbed — it is only the
// picture, which nobody can see right now, that stops.
function parkScreensaver(){
  screensaverEl.classList.add('parked');
  // A video would otherwise keep decoding while hidden on some builds.
  if (!screensaverIsImage) { try { screensaverVideo.pause(); } catch (e) {} }
}

function duckScreensaver(){
  const el = soundEl();
  // The logo picture keeps looping behind the menu either way; it is only
  // the sound that gets out of the way.
  if (el.paused || el.muted) { el.pause(); return; }
  fadeScreensaverVolume(0, 500, () => el.pause());
}
function unduckScreensaver(){
  const el = soundEl();
  el.volume = 0;
  // If the playlist has no address loaded at all (first run, or it gave up
  // while everything was failing), start it rather than resuming nothing.
  if (haveMusic() && musicStarted && !screensaverMusic.getAttribute('src')) playCurrentTrack();
  el.play().catch(() => {});
  fadeScreensaverVolume(1, 600);
  // The logo loop is silent when there are songs, so it is safe to just keep
  // it running whatever happens to the sound.
  // The logo picture needs nothing; a logo VIDEO was paused while parked and
  // has to be started again.
  if (!screensaverIsImage) screensaverVideo.play().catch(() => {});
}

/* ---------------------- View transitions ---------------------- */
function showScreensaver(){
  // The idle timer can fire while someone is still choosing a look. Put back
  // whatever was there rather than leaving a half-made choice on the wall.
  try { closeThemePicker(false); } catch (e) {}
  pauseWarming();   // nothing on the menu is about to be pressed
  currentView = 'screensaver';
  screensaverEl.classList.remove('parked');
  playerEl.classList.remove('is-paused');
  activeGroup = null; activeGroupRoom = null; // always wake up back at the main menu, not wherever a teacher left off
  menuEl.classList.remove('open');
  playerEl.classList.remove('open');
  playerFrameWrap.innerHTML = ''; // stop any playing video
  clearTimeout(playerLoadTimeout);
  clearPlayerTickers();
  playAttemptToken++; // invalidate any in-flight video-load attempt we're leaving behind
  clearIdleTimer();
  unduckScreensaver();
  // Back at rest: a good moment to notice a new version has been published.
  try { checkForNewVersionAtScreensaver(); } catch (e) {}
}

function showMenu(){
  try { closeThemePicker(false); } catch (e) {}
  currentView = 'menu';
  playerEl.classList.remove('is-paused');
  playerEl.classList.remove('open');
  playerFrameWrap.innerHTML = '';
  clearTimeout(playerLoadTimeout);
  clearPlayerTickers();
  playAttemptToken++; // invalidate any in-flight video-load attempt we're leaving behind
  menuEl.classList.add('open');
  parkScreensaver();
  renderButtons();
  updateMenuTitle();
  updateBackButtonLabel();
  duckScreensaver();
  // THE LOGO ALWAYS COMES BACK. Without this the menu is a dead end: it used
  // to clear the idle timer and never set another, so a TV that reached the
  // menu — which happens automatically every time a video finishes — stayed
  // on the menu until someone touched it.
  startMenuIdleTimer();
}

// Plays the video directly with our own <video> element instead of embedding
// Google Drive's own preview page. This used to be a Drive-hosted iframe with
// Drive's own on-screen play button — but that button turned out to be
// unreachable from a TV remote (Fully Kiosk Browser has no way to "click" into
// cross-origin iframe content with a D-pad), so teachers had no way to start
// a video at all. A plain <video> element is ours to control directly: we can
// call .play() ourselves the instant the button is pressed (which is exactly
// the kind of real button-press browsers require to allow autoplay-with-sound
// — no extra tap needed), and our own on-screen back button works the same
// way it does everywhere else in the app.
//
// Getting the actual video bytes reliably took two real fixes, in order:
//
// Fix 1 — finding Google's real download link at all. Google shows a "can't
// scan this file for viruses" warning page instead of the actual video for
// most lesson-video-sized files, and the real "download anyway" link on that
// page is different every time — reading it requires a request our own
// page's JavaScript is blocked from making across origins (confirmed
// directly: a plain fetch() to Google's Drive endpoints from here is
// rejected before it even gets a response). So a small helper program has to
// do that reading instead, from a server, modeled on gdown (a well-known,
// actively maintained tool built specifically to download Drive files this
// way).
//
// Fix 2 — actually playing what that helper finds. The first version of
// that helper found the real link correctly, then just redirected the TV
// straight to Google to fetch it directly — which turned out to still fail
// for every real video, confirmed directly in Chrome's own Network panel:
// every attempt showed "(failed) net::ERR_BLOCKED_BY_ORB." ORB (Opaque
// Response Blocking) is a real browser security feature that blocks a
// <video> tag from playing a file handed back from a different website
// unless that website explicitly allows it — which Google Drive's own
// servers don't. So the helper (netlify/edge-functions/stream-video.js) now
// does one more thing: instead of redirecting the TV to Google, it fetches
// the video itself and streams those bytes back as its own reply — which
// makes the request look, to the browser, exactly like any other file
// already sitting on this same site, with nothing "foreign" left for ORB to
// block. Verified end-to-end, including that a real decoded video frame
// actually loads this way with no blocked request anywhere in the chain.
// -------------------------------------------------------------------------
// WHERE A VIDEO'S BYTES ACTUALLY COME FROM
// -------------------------------------------------------------------------
// There are two ways to get a Drive video onto the TV, and the app tries the
// good one first and quietly falls back to the other if it can't:
//
//   1. "google-direct" — ask Google's official Drive API for the file, with
//      the API key from CONFIG. The video travels straight from Google to the
